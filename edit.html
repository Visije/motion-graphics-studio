<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Editor | Motion Studio</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #090d16;
    color: #e8edf7;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* NAVBAR */

.navbar {
    height: 65px;
    background: #101725;
    border-bottom: 1px solid #293449;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;
}

.logo {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 3px;
}

.logo span {
    color: #54dfff;
}

.nav-links {
    display: flex;
    gap: 25px;
}

.nav-links a {
    text-decoration: none;
    color: #9daec7;
    font-size: 12px;
}

.nav-links a:hover {
    color: #54dfff;
}

.export-button {
    background: #54dfff;
    border: none;
    padding: 10px 22px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

/* EDITOR LAYOUT */

.editor {
    height: calc(100vh - 65px);

    display: grid;

    grid-template-columns: 250px 1fr 250px;
    grid-template-rows: 1fr 270px;
}

/* PANELS */

.panel {
    background: #111a29;
    border-right: 1px solid #283448;
    padding: 18px;
    overflow: auto;
}

.panel-title {
    font-size: 12px;
    letter-spacing: 2px;
    color: #54dfff;
    margin-bottom: 20px;
}

/* MEDIA PANEL */

.upload-box {
    border: 1px dashed #526782;
    border-radius: 8px;

    padding: 35px 10px;

    text-align: center;

    cursor: pointer;

    color: #9daec7;
    font-size: 12px;
}

.upload-box:hover {
    border-color: #54dfff;
}

.upload-icon {
    font-size: 35px;
    margin-bottom: 12px;
}

.media-info {
    margin-top: 20px;
    font-size: 12px;
    color: #91a4bf;
    line-height: 2;
    overflow-wrap: anywhere;
}

/* PREVIEW AREA */

.preview-area {
    background: #080c13;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    min-width: 0;
    padding: 20px;
}

.preview-container {
    width: min(100%, 900px);
    aspect-ratio: 16 / 9;

    background: #03060b;

    display: flex;
    justify-content: center;
    align-items: center;

    border: 1px solid #293449;

    position: relative;
    overflow: hidden;
}

#videoPreview {
    max-width: 100%;
    max-height: 100%;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.placeholder {
    position: absolute;
    color: #586a84;
    text-align: center;
    font-size: 13px;
    pointer-events: none;
}

.preview-controls {
    width: min(100%, 900px);

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 15px;

    padding: 20px;
}

.control-button {
    background: #202d43;
    border: 1px solid #34445d;

    color: white;

    padding: 10px 15px;

    cursor: pointer;
    border-radius: 4px;
}

.control-button:hover {
    background: #304663;
}

.time-display {
    font-size: 12px;
    color: #9db2ce;
}

/* RIGHT PANEL */

.property {
    margin-bottom: 25px;
}

.property label {
    display: block;
    font-size: 12px;
    color: #a8bad2;
    margin-bottom: 10px;
}

.property input,
.property select {
    width: 100%;

    background: #1a2639;
    border: 1px solid #34445d;

    color: white;

    padding: 10px;
    border-radius: 4px;
}

.property input[type="checkbox"] {
    width: auto;
}

.property button {
    width: 100%;
    padding: 10px;

    background: #54dfff;
    color: #07111c;

    border: none;
    border-radius: 4px;

    cursor: pointer;
    font-weight: bold;
}

/* TIMELINE */

.timeline {
    grid-column: 1 / 4;

    background: #101725;
    border-top: 1px solid #293449;

    padding: 18px 25px;
}

.timeline-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 20px;
}

.timeline-header h3 {
    font-size: 13px;
    letter-spacing: 2px;
}

.timeline-track {
    position: relative;

    height: 90px;

    background: #080e19;

    border: 1px solid #2b3b53;

    border-radius: 5px;

    overflow: hidden;
}

.track-label {
    font-size: 10px;
    color: #7e94b2;
    padding: 8px;
}

.clip {
    position: absolute;

    top: 28px;
    left: 0;

    height: 45px;

    width: 100%;

    background: linear-gradient(
        90deg,
        #176b89,
        #225c92
    );

    border: 1px solid #54dfff;

    border-radius: 4px;

    display: flex;
    align-items: center;

    padding-left: 12px;

    font-size: 11px;

    overflow: hidden;
}

.playhead {
    position: absolute;

    top: 0;
    bottom: 0;

    left: 0;

    width: 2px;

    background: #ff5b73;

    z-index: 5;

    pointer-events: none;
}

.playhead::before {
    content: "";

    position: absolute;

    top: 0;
    left: -5px;

    width: 12px;
    height: 12px;

    background: #ff5b73;

    border-radius: 50%;
}

/* RANGE SLIDER */

.trim-controls {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 20px;

    margin-top: 18px;
}

.trim-controls label {
    font-size: 11px;
    color: #9db2ce;
}

.trim-controls input {
    width: 100%;
    margin-top: 8px;
    accent-color: #54dfff;
}

.status {
    color: #8ba1bd;
    font-size: 11px;
    margin-top: 12px;
}

@media(max-width: 900px) {

    body {
        overflow: auto;
    }

    .editor {
        height: auto;

        display: flex;
        flex-direction: column;
    }

    .panel {
        min-height: 180px;
    }

    .preview-area {
        min-height: 400px;
    }

    .timeline {
        min-height: 250px;
    }

    .nav-links {
        display: none;
    }

}

</style>
</head>

<body>

<!-- NAVIGATION -->

<header class="navbar">

    <div class="logo">
        MOTION <span>STUDIO</span>
    </div>

    <nav class="nav-links">

        <a href="index.html">HOME</a>
        <a href="page.html">EXPLORE</a>
        <a href="content.html">CONTENT</a>
        <a href="edit.html">EDITOR</a>

    </nav>

    <button class="export-button" id="exportButton">
        EXPORT VIDEO
    </button>

</header>


<!-- EDITOR -->

<main class="editor">


    <!-- LEFT PANEL -->

    <aside class="panel">

        <div class="panel-title">
            MEDIA LIBRARY
        </div>

        <label class="upload-box" for="videoInput">

            <div class="upload-icon">＋</div>

            IMPORT VIDEO

            <p style="margin-top:10px">
                Click to browse your files
            </p>

        </label>

        <input
            type="file"
            id="videoInput"
            accept="video/*"
            hidden
        >

        <div class="media-info" id="mediaInfo">

            No media imported.

        </div>

    </aside>


    <!-- PREVIEW -->

    <section class="preview-area">

        <div class="preview-container">

            <video
                id="videoPreview"
                playsinline
                preload="metadata"
            ></video>

            <div class="placeholder" id="placeholder">

                <h2>VIDEO PREVIEW</h2>

                <p style="margin-top:10px">
                    Import a video to get started
                </p>

            </div>

        </div>


        <div class="preview-controls">

            <button class="control-button" id="backward">
                ◀
            </button>

            <button class="control-button" id="playButton">
                ▶
            </button>

            <button class="control-button" id="forward">
                ▶
            </button>

            <span class="time-display" id="timeDisplay">
                00:00 / 00:00
            </span>

        </div>

    </section>


    <!-- RIGHT PANEL -->

    <aside class="panel">

        <div class="panel-title">
            VIDEO PROPERTIES
        </div>

        <div class="property">

            <label>Playback Speed</label>

            <select id="speedControl">

                <option value="0.25">0.25x</option>
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1" selected>1x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2x</option>

            </select>

        </div>


        <div class="property">

            <label>Audio</label>

            <label>
                <input type="checkbox" id="muteControl">
                Mute Video
            </label>

        </div>


        <div class="property">

            <label>Video Information</label>

            <div class="media-info" id="videoProperties">
                Waiting for video...
            </div>

        </div>


        <div class="property">

            <button id="resetButton">
                RESET EDITS
            </button>

        </div>

    </aside>


    <!-- TIMELINE -->

    <section class="timeline">

        <div class="timeline-header">

            <h3>TIMELINE</h3>

            <span class="time-display" id="durationDisplay">
                00:00
            </span>

        </div>


        <div class="timeline-track" id="timelineTrack">

            <div class="track-label">
                VIDEO TRACK 01
            </div>

            <div class="clip" id="clip">
                No video loaded
            </div>

            <div class="playhead" id="playhead"></div>

        </div>


        <div class="trim-controls">

            <div>

                <label>
                    TRIM START:
                    <span id="startValue">0.00</span>s
                </label>

                <input
                    type="range"
                    id="trimStart"
                    min="0"
                    max="100"
                    value="0"
                    step="0.01"
                >

            </div>


            <div>

                <label>
                    TRIM END:
                    <span id="endValue">0.00</span>s
                </label>

                <input
                    type="range"
                    id="trimEnd"
                    min="0"
                    max="100"
                    value="100"
                    step="0.01"
                >

            </div>

        </div>

        <div class="status" id="status">
            Import a video to begin editing.
        </div>

    </section>

</main>


<script>

/* ELEMENTS */

const video = document.getElementById("videoPreview");

const videoInput = document.getElementById("videoInput");

const placeholder = document.getElementById("placeholder");

const playButton = document.getElementById("playButton");

const backward = document.getElementById("backward");

const forward = document.getElementById("forward");

const timeDisplay = document.getElementById("timeDisplay");

const mediaInfo = document.getElementById("mediaInfo");

const videoProperties = document.getElementById("videoProperties");

const speedControl = document.getElementById("speedControl");

const muteControl = document.getElementById("muteControl");

const trimStart = document.getElementById("trimStart");

const trimEnd = document.getElementById("trimEnd");

const startValue = document.getElementById("startValue");

const endValue = document.getElementById("endValue");

const clip = document.getElementById("clip");

const playhead = document.getElementById("playhead");

const status = document.getElementById("status");

const exportButton = document.getElementById("exportButton");


let duration = 0;

let sourceURL = null;

let exportURL = null;

let exporting = false;


/* FORMAT TIME */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "00:00";
    }

    const minutes = Math.floor(seconds / 60);

    const secs = Math.floor(seconds % 60);

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );

}


/* IMPORT VIDEO */

videoInput.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) return;

    if (!file.type.startsWith("video/")) {

        status.textContent = "Please select a valid video file.";

        return;

    }

    if (sourceURL) {
        URL.revokeObjectURL(sourceURL);
    }

    sourceURL = URL.createObjectURL(file);

    video.src = sourceURL;

    video.load();

    mediaInfo.innerHTML = `
        <strong>${file.name}</strong><br>
        Size: ${(file.size / 1024 / 1024).toFixed(2)} MB<br>
        Type: ${file.type}
    `;

    placeholder.style.display = "none";

    status.textContent = "Loading video...";

});


/* VIDEO READY */

video.addEventListener("loadedmetadata", function() {

    duration = video.duration;

    if (!Number.isFinite(duration) || duration <= 0) {

        status.textContent = "This video has an unsupported duration.";

        return;

    }

    trimStart.max = duration;

    trimEnd.max = duration;

    trimStart.value = 0;

    trimEnd.value = duration;

    startValue.textContent = "0.00";

    endValue.textContent = duration.toFixed(2);

    durationDisplay.textContent = formatTime(duration);

    clip.textContent = "VIDEO CLIP";

    videoProperties.innerHTML = `
        Duration: ${formatTime(duration)}<br>
        Resolution: ${video.videoWidth} × ${video.videoHeight}<br>
        Frame rate: Not detected
    `;

    status.textContent = "Video successfully imported.";

    updateTimeline();

});


/* PLAY / PAUSE */

playButton.addEventListener("click", async function() {

    if (!video.src) return;

    if (video.paused) {

        if (video.currentTime >= Number(trimEnd.value)) {

            video.currentTime = Number(trimStart.value);

        }

        try {
            await video.play();

            playButton.textContent = "Ⅱ";

        } catch (error) {

            status.textContent = "Playback could not start.";

        }

    } else {

        video.pause();

        playButton.textContent = "▶";

    }

});


/* STOP AT TRIM END */

video.addEventListener("timeupdate", function() {

    if (video.currentTime >= Number(trimEnd.value)) {

        video.pause();

        playButton.textContent = "▶";

    }

    updateTimeline();

});


/* FRAME NAVIGATION */

backward.addEventListener("click", function() {

    video.pause();

    video.currentTime = Math.max(
        Number(trimStart.value),
        video.currentTime - 1 / 30
    );

    playButton.textContent = "▶";

});


forward.addEventListener("click", function() {

    video.pause();

    video.currentTime = Math.min(
        Number(trimEnd.value),
        video.currentTime + 1 / 30
    );

    playButton.textContent = "▶";

});


/* PLAYBACK SPEED */

speedControl.addEventListener("change", function() {

    video.playbackRate = Number(this.value);

});


/* MUTE */

muteControl.addEventListener("change", function() {

    video.muted = this.checked;

});


/* TRIMMING */

trimStart.addEventListener("input", function() {

    const start = Number(this.value);

    const end = Number(trimEnd.value);

    if (start >= end) {

        this.value = Math.max(0, end - 0.01);

    }

    startValue.textContent = Number(this.value).toFixed(2);

    if (video.currentTime < Number(this.value)) {

        video.currentTime = Number(this.value);

    }

    updateTimeline();

});


trimEnd.addEventListener("input", function() {

    const end = Number(this.value);

    const start = Number(trimStart.value);

    if (end <= start) {

        this.value = Math.min(duration, start + 0.01);

    }

    endValue.textContent = Number(this.value).toFixed(2);

    if (video.currentTime > Number(this.value)) {

        video.currentTime = Number(this.value);

    }

    updateTimeline();

});


/* TIMELINE */

function updateTimeline() {

    if (!duration) return;

    const current = video.currentTime;

    const percentage = (current / duration) * 100;

    playhead.style.left = percentage + "%";

    timeDisplay.textContent =
        formatTime(current) + " / " + formatTime(duration);

}


/* CLICK TIMELINE TO SEEK */

document.getElementById("timelineTrack").addEventListener("click", function(e) {

    if (!duration) return;

    const rect = this.getBoundingClientRect();

    const percentage = Math.max(
        0,
        Math.min(1, (e.clientX - rect.left) / rect.width)
    );

    const time = percentage * duration;

    video.currentTime = Math.max(
        Number(trimStart.value),
        Math.min(Number(trimEnd.value), time)
    );

});


/* RESET */

document.getElementById("resetButton").addEventListener("click", function() {

    if (!duration) return;

    video.pause();

    video.currentTime = 0;

    trimStart.value = 0;

    trimEnd.value = duration;

    speedControl.value = 1;

    video.playbackRate = 1;

    muteControl.checked = false;

    video.muted = false;

    startValue.textContent = "0.00";

    endValue.textContent = duration.toFixed(2);

    playButton.textContent = "▶";

    updateTimeline();

    status.textContent = "Edits reset.";

});


/* EXPORT VIDEO */

exportButton.addEventListener("click", async function() {

    if (!video.src || exporting) {

        status.textContent = "Import a video before exporting.";

        return;

    }

    if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {

        status.textContent = "Your browser does not support video export.";

        return;

    }

    exporting = true;

    exportButton.disabled = true;

    status.textContent = "Preparing export...";

    const start = Number(trimStart.value);

    const end = Number(trimEnd.value);

    if (end <= start) {

        status.textContent = "Invalid trim range.";

        exporting = false;

        exportButton.disabled = false;

        return;

    }

    const canvas = document.createElement("canvas");

    canvas.width = video.videoWidth;

    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    const canvasStream = canvas.captureStream(30);

    let combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks()
    ]);

    let audioStream = null;

    try {

        if (typeof video.captureStream === "function") {

            audioStream = video.captureStream();

        } else if (typeof video.mozCaptureStream === "function") {

            audioStream = video.mozCaptureStream();

        }

        if (audioStream) {

            audioStream.getAudioTracks().forEach(track => {

                combinedStream.addTrack(track);

            });

        }

    } catch (error) {

        console.warn("Audio capture unavailable:", error);

    }

    const mimeTypes = [
        "video/webm;codecs=vp9,opus",
        "video/webm;codecs=vp8,opus",
        "video/webm"
    ];

    const mimeType = mimeTypes.find(type =>
        MediaRecorder.isTypeSupported(type)
    );

    if (!mimeType) {

        status.textContent = "No supported WebM encoder found.";

        exporting = false;

        exportButton.disabled = false;

        return;

    }

    const recorder = new MediaRecorder(combinedStream, {
        mimeType: mimeType
    });

    const chunks = [];

    recorder.ondataavailable = e => {

        if (e.data.size > 0) {

            chunks.push(e.data);

        }

    };

    const recording = new Promise((resolve, reject) => {

        recorder.onstop = resolve;

        recorder.onerror = event => reject(event.error);

    });

    const previousTime = video.currentTime;

    const previousSpeed = video.playbackRate;

    const wasMuted = video.muted;

    const wasPlaying = !video.paused;

    video.pause();

    video.playbackRate = Number(speedControl.value);

    // Keep the preview and recording audio settings consistent.
    video.muted = muteControl.checked;

    video.currentTime = start;

    try {

        await new Promise(resolve => {

            video.addEventListener("seeked", resolve, { once: true });

        });

        recorder.start(250);

        let lastDraw = 0;

        function drawFrame(now) {

            if (video.currentTime >= end || video.ended) {

                video.pause();

                recorder.stop();

                return;

            }

            if (now - lastDraw >= 1000 / 30) {

                ctx.drawImage(
                    video,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                lastDraw = now;

            }

            requestAnimationFrame(drawFrame);

        }

        await video.play();

        requestAnimationFrame(drawFrame);

        await recording;

        const blob = new Blob(chunks, {
            type: mimeType
        });

        if (exportURL) {

            URL.revokeObjectURL(exportURL);

        }

        exportURL = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = exportURL;

        link.download = "motion-studio-edit.webm";

        link.click();

        status.textContent =
            "Export completed. Downloaded WebM video.";

    } catch (error) {

        console.error(error);

        if (recorder.state !== "inactive") {

            recorder.stop();

        }

        status.textContent = "Export failed: " + error.message;

    } finally {

        video.pause();

        video.playbackRate = previousSpeed;

        video.muted = wasMuted;

        video.currentTime = previousTime;

        if (wasPlaying) {

            video.play().catch(() => {});

        }

        combinedStream.getTracks().forEach(track => track.stop());

        exporting = false;

        exportButton.disabled = false;

        exportButton.textContent = "EXPORT VIDEO";

    }

});


/* INITIAL STATE */

video.addEventListener("pause", () => {

    playButton.textContent = "▶";

});

video.addEventListener("play", () => {

    playButton.textContent = "Ⅱ";

});

</script>

</body>
</html>
