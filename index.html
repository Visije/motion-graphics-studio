<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Motion Studio | Dancing Musicians</title>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>

<style>

/* =====================================
   GLOBAL RESET
===================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #090d19;
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
}


/* =====================================
   MAIN HERO
===================================== */

.hero {

    position: relative;

    width: 100%;
    height: 100vh;

    min-height: 650px;

    overflow: hidden;

    display: flex;
    align-items: center;

    background:
        radial-gradient(
            circle at 75% 45%,
            #35425b 0%,
            #1a263b 35%,
            #090d19 85%
        );

}


/* =====================================
   ANIMATED BACKGROUND GLOW
===================================== */

.background-glow {

    position: absolute;

    width: 550px;
    height: 550px;

    right: 12%;
    top: 50%;

    transform: translateY(-50%);

    border-radius: 50%;

    background: #54dfff;

    opacity: 0.10;

    filter: blur(140px);

    pointer-events: none;

}


/* =====================================
   NAVIGATION
===================================== */

.main-navigation {

    position: absolute;

    top: 35px;
    left: 8%;
    right: 8%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    z-index: 20;

}

.logo {

    font-size: 21px;

    font-weight: 900;

    letter-spacing: 3px;

    color: white;

}

.logo span {

    color: #54dfff;

}

.nav-links {

    display: flex;

    gap: 32px;

}

.nav-links a {

    text-decoration: none;

    color: #bdc9dc;

    font-size: 12px;

    letter-spacing: 1.5px;

    transition: color 0.3s;

}

.nav-links a:hover {

    color: #54dfff;

}


/* =====================================
   HERO CONTENT
===================================== */

.hero-content {

    position: relative;

    z-index: 5;

    margin-left: 10%;

    width: 42%;

}

.eyebrow {

    font-size: 12px;

    letter-spacing: 5px;

    color: #54dfff;

}

.hero-content h1 {

    font-size: clamp(65px, 8vw, 120px);

    line-height: 0.95;

    font-weight: 900;

    letter-spacing: -5px;

    margin-top: 25px;

}

.hero-content h1 span {

    color: #54dfff;

}

.hero-content p {

    margin-top: 30px;

    max-width: 420px;

    color: #aabbd2;

    font-size: 15px;

    line-height: 1.8;

    letter-spacing: 0.5px;

}


/* =====================================
   CHARACTER CONTAINER
===================================== */

.character-container {

    position: absolute;

    right: 5%;

    top: 50%;

    transform: translateY(-50%);

    width: min(49vw, 620px);

    height: 85vh;

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 3;

}


/* =====================================
   CHARACTER IMAGE
===================================== */

.musician-characters {

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: block;

    transform-origin: 50% 85%;

    will-change: transform;

    filter:

        drop-shadow(
            0 25px 35px rgba(0,0,0,0.35)
        );

}


/* =====================================
   CHARACTER GLOW
===================================== */

.character-glow {

    position: absolute;

    width: 75%;
    height: 65%;

    background: rgba(84,223,255,0.13);

    filter: blur(100px);

    border-radius: 50%;

    z-index: -1;

}


/* =====================================
   PARTICLES
===================================== */

.particles {

    position: absolute;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 1;

}

.particle {

    position: absolute;

    width: 4px;
    height: 4px;

    background: #54dfff;

    border-radius: 50%;

    opacity: 0.5;

    box-shadow:

        0 0 12px #54dfff;

}


/* =====================================
   DECORATIVE LABEL
===================================== */

.bottom-label {

    position: absolute;

    bottom: 40px;

    left: 10%;

    color: #71829c;

    font-size: 10px;

    letter-spacing: 4px;

    z-index: 5;

}


/* =====================================
   DANCE INDICATOR
===================================== */

.dance-indicator {

    position: absolute;

    right: 8%;

    bottom: 40px;

    display: flex;

    align-items: center;

    gap: 10px;

    color: #aabbd2;

    font-size: 10px;

    letter-spacing: 3px;

    z-index: 5;

}

.indicator-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #54dfff;

    box-shadow: 0 0 12px #54dfff;

}


/* =====================================
   RESPONSIVE
===================================== */

@media(max-width: 850px) {

    .hero {

        justify-content: center;

        align-items: flex-start;

    }

    .hero-content {

        margin: 140px auto 0;

        width: 90%;

        text-align: center;

    }

    .hero-content h1 {

        font-size: 65px;

    }

    .hero-content p {

        margin: 20px auto;

    }

    .character-container {

        width: 90vw;

        height: 55vh;

        right: 5%;

        top: auto;

        bottom: 0;

    }

    .bottom-label {

        display: none;

    }

    .nav-links {

        gap: 12px;

    }

    .nav-links a {

        font-size: 9px;

    }

}

@media(max-width: 480px) {

    .logo {

        font-size: 15px;

    }

    .nav-links {

        gap: 8px;

    }

    .nav-links a {

        font-size: 8px;

    }

    .hero-content h1 {

        font-size: 52px;

    }

}


/* =====================================
   REDUCED MOTION
===================================== */

@media(prefers-reduced-motion: reduce) {

    * {

        scroll-behavior: auto !important;

    }

}

</style>

</head>


<body>


<!-- =====================================
     HERO SECTION
===================================== -->

<main class="hero">


    <!-- BACKGROUND -->

    <div class="background-glow"></div>


    <!-- PARTICLES -->

    <div class="particles" id="particles"></div>


    <!-- NAVIGATION -->

    <nav class="main-navigation">

        <div class="logo">

            MOTION<span>.</span>

        </div>


        <div class="nav-links">

            <a href="index.html">HOME</a>

            <a href="page.html">EXPLORE</a>

            <a href="content.html">CONTENT</a>

        </div>

    </nav>



    <!-- LEFT CONTENT -->

    <section class="hero-content">

        <div class="eyebrow">

            CREATIVE MOTION STUDIO

        </div>


        <h1>

            LET'S<br>

            <span>DANCE.</span>

        </h1>


        <p>

            Two musicians. One rhythm.

            A little music, a little movement,

            and a whole lot of personality.

        </p>

    </section>



    <!-- CHARACTER IMAGE -->

    <div class="character-container">

        <div class="character-glow"></div>


        <img

            src="assets/musician-characters.png"

            class="musician-characters"

            alt="Two sculptural musicians playing a microphone and trumpet"

        >

    </div>



    <!-- FOOTER -->

    <div class="bottom-label">

        CHARACTER ANIMATION / 001

    </div>


    <div class="dance-indicator">

        <div class="indicator-dot"></div>

        MUSIC IN MOTION

    </div>


</main>



<!-- =====================================
     GSAP ANIMATION ENGINE
===================================== -->

<script>


// =====================================
// SELECT ELEMENTS
// =====================================

const characters = document.querySelector(
    ".musician-characters"
);

const glow = document.querySelector(
    ".character-glow"
);

const backgroundGlow = document.querySelector(
    ".background-glow"
);

const particleContainer = document.getElementById(
    "particles"
);


// =====================================
// REDUCED MOTION CHECK
// =====================================

const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
).matches;


// =====================================
// CHARACTER DANCE ANIMATION
// =====================================

if (!reducedMotion) {


    // Main body sway

    gsap.to(characters, {

        rotation: 2.2,

        y: -9,

        duration: 1.5,

        repeat: -1,

        yoyo: true,

        ease: "sine.inOut"

    });



    // Secondary rhythmic movement

    gsap.to(characters, {

        scale: 1.015,

        duration: 1.1,

        repeat: -1,

        yoyo: true,

        ease: "sine.inOut"

    });



    // Character lighting

    gsap.to(glow, {

        opacity: 0.35,

        scale: 1.2,

        duration: 2,

        repeat: -1,

        yoyo: true,

        ease: "sine.inOut"

    });



    // Background glow movement

    gsap.to(backgroundGlow, {

        scale: 1.3,

        opacity: 0.17,

        duration: 4,

        repeat: -1,

        yoyo: true,

        ease: "sine.inOut"

    });


}



// =====================================
// PARTICLE GENERATION
// =====================================

for (let i = 0; i < 30; i++) {

    const particle = document.createElement("div");

    particle.className = "particle";

    particleContainer.appendChild(particle);


    gsap.set(particle, {

        x: Math.random() * window.innerWidth,

        y: Math.random() * window.innerHeight,

        scale: Math.random() * 1.5 + 0.5

    });


    if (!reducedMotion) {

        gsap.to(particle, {

            y: "-=120",

            x: "+=" + (Math.random() * 60 - 30),

            opacity: 0,

            duration: Math.random() * 4 + 3,

            repeat: -1,

            delay: Math.random() * 4,

            ease: "none",

            repeatRefresh: true

        });

    }

}



// =====================================
// IMAGE LOAD CHECK
// =====================================

characters.addEventListener("load", () => {

    console.log("Musician characters loaded successfully.");

});

characters.addEventListener("error", () => {

    console.error(
        "Character image not found. Check assets/musician-characters.png"
    );

});


// =====================================
// ENTRANCE ANIMATION
// =====================================

if (!reducedMotion) {

    gsap.from(".hero-content > *", {

        opacity: 0,

        y: 35,

        duration: 1.2,

        stagger: 0.2,

        ease: "power3.out"

    });


    gsap.from(characters, {

        opacity: 0,

        x: 100,

        duration: 1.6,

        ease: "power3.out",

        delay: 0.3

    });


    gsap.from(".main-navigation", {

        opacity: 0,

        y: -20,

        duration: 1,

        ease: "power3.out"

    });

}

</script>


</body>

</html>
