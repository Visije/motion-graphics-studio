<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D House Model</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #10141c;
    font-family: Arial, sans-serif;
    color: white;
}

#scene {
    position: fixed;
    inset: 0;
}

#ui {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    width: 270px;
    padding: 20px;
    background: rgba(20,25,35,.94);
    border: 1px solid #343b49;
    border-radius: 12px;
}

#ui h2 {
    font-size: 19px;
    margin-bottom: 7px;
}

#ui p {
    color: #aeb8c8;
    font-size: 12px;
    margin-bottom: 16px;
    line-height: 1.5;
}

button {
    width: 100%;
    padding: 11px;
    margin-top: 8px;
    border: 1px solid #454f60;
    border-radius: 7px;
    background: #252e3c;
    color: white;
    cursor: pointer;
    font-size: 13px;
}

button:hover {
    background: #39485c;
}

button.active {
    background: #b77c43;
    border-color: #d49b64;
}

#dimensions {
    margin-top: 15px;
    padding-top: 12px;
    border-top: 1px solid #394353;
    color: #c4cbd5;
    font-size: 12px;
    line-height: 1.8;
}

#loading {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #10141c;
    z-index: 20;
    color: white;
    text-align: center;
    padding: 20px;
}

#loading.hidden {
    display: none;
}

#hint {
    position: fixed;
    bottom: 18px;
    right: 20px;
    color: #c0c8d5;
    font-size: 12px;
    background: rgba(20,25,35,.8);
    padding: 10px 14px;
    border-radius: 7px;
}

@media(max-width:600px) {
    #ui {
        width: 210px;
        top: 10px;
        left: 10px;
        padding: 13px;
    }
}
</style>
</head>

<body>

<div id="scene"></div>

<div id="ui">
    <h2>HOUSE MODEL</h2>
    <p>Single-storey residential layout · 27 × 24 ft</p>

    <button id="roofBtn" class="active">Hide Roof / Show Interior</button>
    <button id="topBtn">Top View</button>
    <button id="frontBtn">Front View</button>
    <button id="resetBtn">Reset Camera</button>

    <div id="dimensions">
        <div>Plot: 27 ft × 24 ft</div>
        <div>Built-up footprint: 648 sq ft</div>
        <div>Bedrooms: 2</div>
        <div>Kitchen: 1</div>
        <div>Toilet: 1</div>
        <div>Bathroom: 1</div>
    </div>
</div>

<div id="loading">Loading 3D house model...</div>

<div id="hint">
    Drag: Rotate &nbsp; | &nbsp; Scroll: Zoom &nbsp; | &nbsp; Right-click: Pan
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
(function () {

try {

if (!window.THREE || !THREE.OrbitControls) {
    throw new Error("Three.js could not load. Check your internet connection.");
}

const container = document.getElementById("scene");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141c);

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(35, 29, 39);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;

container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(13.5, 0, -12);
controls.maxPolarAngle = Math.PI / 2.05;

/* LIGHTING */

scene.add(new THREE.HemisphereLight(0xffffff, 0x55515a, 1.2));

const sunlight = new THREE.DirectionalLight(0xffffff, 2);
sunlight.position.set(20, 35, 25);
sunlight.castShadow = true;
sunlight.shadow.mapSize.set(2048,2048);
scene.add(sunlight);

/* MATERIALS */

const materials = {
    ground: new THREE.MeshStandardMaterial({color:0x303844}),
    floor: new THREE.MeshStandardMaterial({color:0xd9cbb5}),
    wall: new THREE.MeshStandardMaterial({color:0xe9e3d9}),
    outer: new THREE.MeshStandardMaterial({color:0xc7b9a7}),
    wood: new THREE.MeshStandardMaterial({color:0x79543b}),
    darkWood: new THREE.MeshStandardMaterial({color:0x4a3023}),
    glass: new THREE.MeshStandardMaterial({
        color:0x75b9cf,
        transparent:true,
        opacity:0.55
    }),
    white: new THREE.MeshStandardMaterial({color:0xf4f1e9}),
    bed: new THREE.MeshStandardMaterial({color:0x8497a5}),
    kitchen: new THREE.MeshStandardMaterial({color:0x777f89}),
    black: new THREE.MeshStandardMaterial({color:0x292d33}),
    metal: new THREE.MeshStandardMaterial({color:0xb9c1c9,metalness:.7,roughness:.25}),
    green: new THREE.MeshStandardMaterial({color:0x567b55}),
    tile: new THREE.MeshStandardMaterial({color:0xb9c8ca})
};

/* GROUPS */

const house = new THREE.Group();
scene.add(house);

const roofGroup = new THREE.Group();
house.add(roofGroup);

const furniture = new THREE.Group();
house.add(furniture);

const labels = new THREE.Group();
house.add(labels);

/* BOX FUNCTION */

function box(parent, x, y, z, w, h, d, material) {

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        material
    );

    mesh.position.set(x+w/2, y+h/2, z+d/2);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);
    return mesh;
}

/* FLOOR AND PLOT */

box(house, -1, -0.3, -25, 29, 0.3, 26, materials.ground);

box(house, 0, 0, -24, 27, 0.25, 24, materials.floor);

/* DIMENSIONS:
   X = 0 to 27
   Z = 0 to -24
   FRONT = Z = 0
*/

const H = 9;
const T = 0.35;

/* WALL FUNCTION */

function wallX(x1, x2, z, material=materials.wall, height=H) {
    box(house, x1, 0.25, z-T/2, x2-x1, height, T, material);
}

function wallZ(x, z1, z2, material=materials.wall, height=H) {
    box(house, x-T/2, 0.25, z2, T, height, z1-z2, material);
}

/* OUTER WALLS */

wallX(0,27,0,materials.outer);
wallX(0,27,-24,materials.outer);
wallZ(0,0,-24,materials.outer);
wallZ(27,0,-24,materials.outer);

/* FRONT DOOR OPENING:
   Living-room entrance is left open.
*/

/* FRONT WALL WITH MAIN ENTRANCE */

house.remove(house.children[house.children.length-1]);

wallX(0,4.5,0,materials.outer);
wallX(8,27,0,materials.outer);

/* MAIN INTERNAL PARTITIONS */

/* Living room / Bedroom 2 */
wallX(0,5,-10);
wallX(8,12,-10);

/* Living room / Bedroom 1 */
wallZ(15,0,-4);
wallZ(15,-7,-10);

/* Bedroom 2 / rear service area */
wallZ(12,-10,-11);
wallZ(12,-14,-24);

/* Kitchen / passage */
wallX(12,21,-18);

/* Kitchen / toilet */
wallZ(21,-10,-18);

/* Toilet / bathroom */
wallX(21,27,-17);

/* REAR WINDOWS */

function windowX(x,z,width) {
    const w = box(house,x,3,z-T/2,width,2,T,materials.glass);
    return w;
}

windowX(2,-24,4);
windowX(17,-24,4);

/* SIDE WINDOWS */

function windowZ(x,z,width) {
    box(house,x-T/2,3,z-width/2,T,2,width,materials.glass);
}

windowZ(0,-5,3);
windowZ(27,-5,3);
windowZ(0,-18,3);

/* DOORS */

function door(x,z,width,depth=0.15) {

    const d = box(
        house,
        x,
        0.25,
        z,
        width,
        7,
        depth,
        materials.wood
    );

    return d;
}

/* MAIN DOOR */

door(4.5,0,3);

/* BEDROOM DOORS */
door(5,-10,3);
door(15,-4.5,3);

/* BEDROOM 2 DOOR */
door(12,-11,3,0.15);

/* LABELS */

function makeLabel(text,x,z) {

    const canvas = document.createElement("canvas");
    canvas.width = 512;
    canvas.height = 128;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "rgba(20,25,35,0.85)";
    ctx.fillRect(0,0,512,128);

    ctx.font = "bold 43px Arial";
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text,256,64);

    const texture = new THREE.CanvasTexture(canvas);

    const sprite = new THREE.Sprite(
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true
        })
    );

    sprite.position.set(x,10,z);
    sprite.scale.set(7,1.75,1);

    labels.add(sprite);
}

makeLabel("LIVING ROOM",7.5,-5);
makeLabel("BEDROOM 1",21,-5);
makeLabel("BEDROOM 2",6,-17);
makeLabel("KITCHEN",16.5,-14);
makeLabel("TOILET",24,-13.5);
makeLabel("BATHROOM",24,-21);

/* BED FUNCTION */

function makeBed(x,z,w=6,d=7) {

    box(furniture,x,0.4,z,w,0.8,d,materials.wood);

    box(furniture,x+0.25,1.2,z+0.25,w-0.5,0.35,d-0.5,materials.bed);

    box(furniture,x+0.5,1.6,z+0.5,w/2-0.5,0.35,1.4,materials.white);
    box(furniture,x+w/2,1.6,z+0.5,w/2-0.5,0.35,1.4,materials.white);
}

/* BEDROOM FURNITURE */

makeBed(3,-20,6,7);
makeBed(18,-6.5,6,7);

/* WARDROBES */

box(furniture,0.5,0.3,-13,2.5,6,4,materials.wood);
box(furniture,24,0.3,-13,2.5,6,3,materials.wood);

/* LIVING ROOM SOFA */

box(furniture,2,0.4,-3,7,1.5,2,materials.bed);
box(furniture,2,0.4,-7,2,1.5,4,materials.bed);

/* CENTER TABLE */

box(furniture,8,0.5,-5,4,0.5,2.5,materials.wood);

/* TV UNIT */

box(furniture,10,0.3,-0.8,4,2.5,0.6,materials.darkWood);

/* KITCHEN CABINETS */

box(furniture,12.5,0.3,-18.5,8,3,2,materials.kitchen);
box(furniture,12.5,3.5,-18.5,8,2,2,materials.wood);

/* KITCHEN COUNTER */

box(furniture,12.5,3.3,-18.5,8,0.35,2,materials.white);

/* SINK */

box(furniture,14,3.5,-18,2,0.12,1,materials.metal);

/* COOKTOP */

box(furniture,18,3.55,-18,2,0.15,1,materials.black);

/* TOILET */

box(furniture,22,0.3,-13,2,1.2,2,materials.white);

const toiletSeat = new THREE.Mesh(
    new THREE.TorusGeometry(.55,.12,10,32),
    materials.white
);

toiletSeat.rotation.x=Math.PI/2;
toiletSeat.position.set(24,1.1,-13);
furniture.add(toiletSeat);

/* BATHROOM */

box(furniture,22,0.3,-22,3,0.3,3,materials.tile);

/* SHOWER */

box(furniture,25,0.3,-22,0.15,6,0.15,materials.metal);

/* WASH BASIN */

box(furniture,22,2,-20,2,0.6,1,materials.white);

/* CEILING / ROOF */

box(roofGroup,0,9.5,-24,27,0.35,24,materials.outer);

/* ROOF EDGE */

const roofEdges = [
    [0,-24,27,.3],
    [0,0,27,.3],
    [0,0,.3,24],
    [27,0,.3,24]
];

roofEdges.forEach(v => {
    box(roofGroup,v[0],9.7,v[1],v[2],0.35,v[3],materials.darkWood);
});

/* EXTERIOR ENTRY STEPS */

box(house,4,0.1,0.5,4,0.25,1,materials.outer);
box(house,4,0.1,1.5,4,0.25,1,materials.outer);

/* OUTSIDE ROAD / FRONT */

box(house,-5,-0.4,2,37,0.15,3,materials.black);

/* CAMERA PRESETS */

function setCamera(x,y,z,targetX=13.5,targetY=0,targetZ=-12) {

    camera.position.set(x,y,z);
    controls.target.set(targetX,targetY,targetZ);
    controls.update();
}

/* BUTTONS */

let roofVisible = true;

document.getElementById("roofBtn").addEventListener("click",function() {

    roofVisible = !roofVisible;
    roofGroup.visible = roofVisible;

    this.textContent = roofVisible
        ? "Hide Roof / Show Interior"
        : "Show Roof";

    this.classList.toggle("active",roofVisible);
});

document.getElementById("topBtn").addEventListener("click",function() {
    setCamera(13.5,45,-12);
});

document.getElementById("frontBtn").addEventListener("click",function() {
    setCamera(13.5,18,32,13.5,2,-12);
});

document.getElementById("resetBtn").addEventListener("click",function() {
    setCamera(35,29,39);
});

/* RESIZE */

window.addEventListener("resize",function() {

    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth,window.innerHeight);
});

/* RENDER */

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene,camera);
}

animate();

document.getElementById("loading").classList.add("hidden");

} catch(error) {

    document.getElementById("loading").innerHTML =
        "<div><h2>3D Model Error</h2><p style='margin-top:12px'>" +
        error.message +
        "</p><p style='margin-top:12px'>Check your internet connection and browser console.</p></div>";

    console.error(error);
}

})();
</script>

</body>
</html>
