<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Footage | Bottle</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #fafaf8;
}

/* MAIN STAGE */

.stage {
    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            ellipse at 50% 45%,
            #ffffff 0%,
            #fafaf8 65%,
            #f1f0ec 100%
        );

    overflow: hidden;
}

/* BOTTLE CONTAINER */

.bottle-container {

    position: relative;

    width: 280px;
    height: 620px;

    display: flex;
    justify-content: center;
    align-items: center;

    animation: bottleFloat 5s ease-in-out infinite;

}

/* SVG */

.bottle {
    width: 100%;
    height: 100%;

    overflow: visible;

    filter:
        drop-shadow(12px 22px 18px rgba(0,0,0,0.12));
}

/* FLOATING ANIMATION */

@keyframes bottleFloat {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }

}

/* RESPONSIVE */

@media(max-width: 600px) {

    .bottle-container {
        transform: scale(0.85);
    }

    @keyframes bottleFloat {

        0%, 100% {
            transform: scale(0.85) translateY(0);
        }

        50% {
            transform: scale(0.85) translateY(-7px);
        }

    }

}

</style>
</head>


<body>

<main class="stage">

<div class="bottle-container">

<svg
    class="bottle"
    viewBox="0 0 280 620"
    xmlns="http://www.w3.org/2000/svg"
>

<defs>

    <!-- GLASS BODY GRADIENT -->

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">

        <stop offset="0%" stop-color="#b7b98c" stop-opacity="0.35"/>

        <stop offset="8%" stop-color="#ffffff" stop-opacity="0.75"/>

        <stop offset="22%" stop-color="#f4f0c8" stop-opacity="0.2"/>

        <stop offset="48%" stop-color="#ffffff" stop-opacity="0.15"/>

        <stop offset="75%" stop-color="#d5d5a2" stop-opacity="0.3"/>

        <stop offset="94%" stop-color="#ffffff" stop-opacity="0.8"/>

        <stop offset="100%" stop-color="#a7a77c" stop-opacity="0.4"/>

    </linearGradient>


    <!-- OIL GRADIENT -->

    <linearGradient id="oil" x1="0" y1="0" x2="1" y2="0">

        <stop offset="0%" stop-color="#b7ad55" stop-opacity="0.55"/>

        <stop offset="15%" stop-color="#e6df9b" stop-opacity="0.7"/>

        <stop offset="40%" stop-color="#f4f0bd" stop-opacity="0.55"/>

        <stop offset="70%" stop-color="#e8df9c" stop-opacity="0.55"/>

        <stop offset="100%" stop-color="#a9a04c" stop-opacity="0.45"/>

    </linearGradient>


    <!-- OIL LIGHT -->

    <linearGradient id="oilLight" x1="0" y1="0" x2="0" y2="1">

        <stop offset="0%" stop-color="#fffbd6" stop-opacity="0.8"/>

        <stop offset="100%" stop-color="#c6bb68" stop-opacity="0.2"/>

    </linearGradient>


    <!-- GLASS REFLECTION -->

    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="0">

        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>

        <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>

        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>

    </linearGradient>


    <!-- CORK GRADIENT -->

    <linearGradient id="cork" x1="0" y1="0" x2="1" y2="0">

        <stop offset="0%" stop-color="#79552f"/>

        <stop offset="30%" stop-color="#c4a16b"/>

        <stop offset="60%" stop-color="#a98250"/>

        <stop offset="100%" stop-color="#6f4a29"/>

    </linearGradient>


    <!-- NECK GLASS -->

    <linearGradient id="neckGlass" x1="0" y1="0" x2="1" y2="0">

        <stop offset="0%" stop-color="#a5a579" stop-opacity="0.5"/>

        <stop offset="30%" stop-color="#ffffff" stop-opacity="0.8"/>

        <stop offset="70%" stop-color="#f3eebd" stop-opacity="0.3"/>

        <stop offset="100%" stop-color="#a6a276" stop-opacity="0.5"/>

    </linearGradient>


    <!-- BLUR SHADOW -->

    <filter id="shadow">

        <feGaussianBlur stdDeviation="12"/>

    </filter>


    <!-- CLIP OIL INSIDE BOTTLE -->

    <clipPath id="bodyClip">

        <path d="
            M92 260
            Q92 225 112 205
            L112 160
            L168 160
            L168 205
            Q188 225 188 260
            L188 520
            Q188 538 170 538
            L110 538
            Q92 538 92 520
            Z
        "/>

    </clipPath>

</defs>


<!-- GROUND SHADOW -->

<ellipse
    cx="145"
    cy="560"
    rx="83"
    ry="15"
    fill="#000000"
    opacity="0.12"
    filter="url(#shadow)"
/>


<!-- BOTTLE BODY -->

<g>

    <!-- Oil inside -->

    <path
        d="
            M96 270
            Q96 230 116 210
            L116 160
            L164 160
            L164 210
            Q184 230 184 270
            L184 520
            Q184 534 168 534
            L112 534
            Q96 534 96 520
            Z
        "
        fill="url(#oil)"
    />


    <!-- Oil central illumination -->

    <rect
        x="112"
        y="260"
        width="55"
        height="260"
        fill="url(#oilLight)"
        opacity="0.5"
        clip-path="url(#bodyClip)"
    />


    <!-- Bottle glass body -->

    <path
        d="
            M92 260
            Q92 225 112 205
            L112 160
            L168 160
            L168 205
            Q188 225 188 260
            L188 520
            Q188 538 170 538
            L110 538
            Q92 538 92 520
            Z
        "
        fill="url(#glass)"
        stroke="#b5b58b"
        stroke-opacity="0.55"
        stroke-width="2"
    />


    <!-- Left glass highlight -->

    <path
        d="
            M99 265
            Q99 230 117 210
            L117 170
        "
        fill="none"
        stroke="#ffffff"
        stroke-width="5"
        opacity="0.8"
        stroke-linecap="round"
    />


    <path
        d="
            M101 280
            L101 510
        "
        fill="none"
        stroke="#ffffff"
        stroke-width="3"
        opacity="0.7"
        stroke-linecap="round"
    />


    <!-- Right glass reflection -->

    <path
        d="
            M181 270
            L181 510
        "
        fill="none"
        stroke="#a7a36f"
        stroke-width="3"
        opacity="0.45"
    />


    <!-- Body front reflection -->

    <path
        d="
            M118 255
            Q115 330 117 500
        "
        fill="none"
        stroke="#ffffff"
        stroke-width="2"
        opacity="0.35"
    />


    <!-- Bottom thick glass -->

    <path
        d="
            M94 518
            Q140 528 186 518
            L186 529
            Q140 544 94 529
            Z
        "
        fill="#d5d3a5"
        opacity="0.45"
    />


</g>


<!-- BOTTLE NECK -->

<g>

    <path
        d="
            M115 154
            L115 100
            Q115 94 122 94
            L158 94
            Q165 94 165 100
            L165 154
            Z
        "
        fill="url(#neckGlass)"
        stroke="#b7b38c"
        stroke-width="2"
    />


    <!-- Oil inside neck -->

    <rect
        x="122"
        y="120"
        width="36"
        height="34"
        fill="url(#oil)"
        opacity="0.65"
    />


    <!-- Neck reflection -->

    <path
        d="M120 103 L120 150"
        stroke="#ffffff"
        stroke-width="3"
        opacity="0.8"
    />

    <path
        d="M160 104 L160 151"
        stroke="#b0a96e"
        stroke-width="2"
        opacity="0.4"
    />


    <!-- Neck ring -->

    <rect
        x="111"
        y="147"
        width="58"
        height="12"
        rx="3"
        fill="url(#glass)"
        stroke="#b4b18a"
        stroke-width="1.5"
    />

</g>


<!-- CORK STOPPER -->

<g>

    <!-- Cork base -->

    <path
        d="
            M117 89
            L163 89
            L160 102
            L120 102
            Z
        "
        fill="url(#cork)"
    />


    <!-- Main cork -->

    <path
        d="
            M116 48
            Q140 44 164 48
            L160 91
            L120 91
            Z
        "
        fill="url(#cork)"
        stroke="#74512e"
        stroke-width="1"
    />


    <!-- Cork texture -->

    <path
        d="M123 55 L125 85"
        stroke="#e1c18a"
        stroke-width="2"
        opacity="0.4"
    />

    <path
        d="M137 52 L138 87"
        stroke="#604224"
        stroke-width="2"
        opacity="0.25"
    />

    <path
        d="M151 53 L149 85"
        stroke="#e4c28c"
        stroke-width="2"
        opacity="0.4"
    />


    <!-- Cork top -->

    <ellipse
        cx="140"
        cy="48"
        rx="24"
        ry="5"
        fill="#c6a574"
    />

</g>


<!-- FINAL GLASS DETAILS -->

<path
    d="
        M94 260
        Q94 235 109 218
    "
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    opacity="0.7"
/>


<ellipse
    cx="140"
    cy="537"
    rx="32"
    ry="3"
    fill="#ffffff"
    opacity="0.6"
/>


</svg>

</div>

</main>

</body>
</html>
