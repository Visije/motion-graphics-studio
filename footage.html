<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Complete Animation Playground</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #090a0f;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Cinematic Camera Rig */
    .camera-rig {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: center center;
    }

    /* 4. Particle Layer */
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* 2. Shape Layer */
    .shape-stage {
      position: absolute;
      width: 400px;
      height: 400px;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .geo-shape {
      position: absolute;
      border: 2px solid rgba(0, 240, 255, 0.6);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
    }

    .shape-1 {
      width: 220px;
      height: 220px;
      border-radius: 20%;
    }

    .shape-2 {
      width: 160px;
      height: 160px;
      border-color: rgba(255, 0, 128, 0.7);
      box-shadow: 0 0 25px rgba(255, 0, 128, 0.3);
    }

    /* 1. Text Layer */
    .text-stage {
      position: relative;
      z-index: 3;
      text-align: center;
      pointer-events: none;
    }

    .title-mask {
      overflow: hidden;
      padding: 10px 0;
    }

    .kinetic-title {
      font-size: clamp(2.5rem, 6vw, 5.5rem);
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      display: inline-block;
    }

    .char {
      display: inline-block;
      transform: translateY(120%);
      opacity: 0;
    }

    .subtitle {
      font-size: 1.1rem;
      letter-spacing: 0.4em;
      color: #8892b0;
      text-transform: uppercase;
      margin-top: 10px;
      opacity: 0;
    }

    /* 3. Cinematic Letterbox Bars */
    .cinema-bar {
      position: fixed;
      left: 0;
      width: 100%;
      height: 0vh;
      background: #000;
      z-index: 10;
    }
    .bar-top { top: 0; }
    .bar-bottom { bottom: 0; }

    /* Playback Controls */
    .controls {
      position: fixed;
      bottom: 24px;
      z-index: 20;
      display: flex;
      gap: 12px;
    }

    button {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.05em;
      transition: background 0.2s;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <!-- Cinematic Bars -->
  <div class="cinema-bar bar-top"></div>
  <div class="cinema-bar bar-bottom"></div>

  <!-- Camera Rig -->
  <div class="camera-rig" id="camera">
    <!-- Particle Layer -->
    <canvas id="particle-canvas"></canvas>

    <!-- Shape Layer -->
    <div class="shape-stage">
      <div class="geo-shape shape-1"></div>
      <div class="geo-shape shape-2"></div>
    </div>

    <!-- Text Layer -->
    <div class="text-stage">
      <div class="title-mask">
        <h1 class="kinetic-title" id="split-text">VELOCITY</h1>
      </div>
      <p class="subtitle">GSAP Timeline Architecture</p>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button id="btn-play">Play / Resume</button>
    <button id="btn-pause">Pause</button>
    <button id="btn-restart">Restart Timeline</button>
  </div>

  <!-- GSAP Core CDN -->
  <script src="https://cloudflare.com"></script>

  <script>
    // ==========================================
    // 1. TEXT SETUP: Split characters for stagger
    // ==========================================
    const titleEl = document.getElementById('split-text');
    const chars = titleEl.textContent.split('').map(char => {
      return `<span class="char">${char === ' ' ? '&nbsp;' : char}</span>`;
    }).join('');
    titleEl.innerHTML = chars;

    // ==========================================
    // 4. PARTICLE SETUP: Glowing HTML5 Canvas
    // ==========================================
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = Array.from({ length: 65 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      radius: Math.random() * 2.5 + 0.5,
      vx: (Math.random() - 0.5) * 1.2,
      vy: (Math.random() - 0.5) * 1.2,
      alpha: Math.random() * 0.8 + 0.2,
      color: Math.random() > 0.5 ? '#00f0ff' : '#ff0080'
    }));

    // Particle state controlled by GSAP
    const particleState = { speedMultiplier: 1, glow: 10 };

    function renderParticles() {
      // Trail effect using semi-transparent clear
      ctx.fillStyle = 'rgba(9, 10, 15, 0.25)';
      ctx.fillRect(0, 0, width, height);

      particles.forEach(p => {
        p.x += p.vx * particleState.speedMultiplier;
        p.y += p.vy * particleState.speedMultiplier;

        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = particleState.glow;
        ctx.shadowColor = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    // Hook particle loop into GSAP's native ticker for 60/120fps sync
    gsap.ticker.add(renderParticles);

    // ==========================================
    // MASTER TIMELINE: Combining all 4 pillars
    // ==========================================
    const masterTL = gsap.timeline({ defaults: { ease: 'power3.out' } });

    masterTL
      // 3. Cinematic Intro: Close letterbox bars & zoom out camera
      .to('.cinema-bar', { height: '10vh', duration: 1.2, ease: 'power2.inOut' }, 0)
      .from('#camera', { scale: 1.4, rotation: -3, duration: 2.2, ease: 'expo.out' }, 0)
      
      // 4. Particle Surge: Boost speed & glow during intro
      .fromTo(particleState, 
        { speedMultiplier: 8, glow: 25 }, 
        { speedMultiplier: 1, glow: 10, duration: 2, ease: 'power2.out' }, 
      0)

      // 2. Shape Animation: Scale, rotate, and morph border-radius
      .from('.shape-1', { scale: 0, rotation: -180, duration: 1.4, ease: 'back.out(1.7)' }, 0.3)
      .from('.shape-2', { scale: 0, rotation: 180, duration: 1.4, ease: 'back.out(1.7)' }, 0.5)
      .to('.shape-1', { 
        borderRadius: '50%', 
        rotation: 90, 
        scale: 1.15, 
        duration: 3, 
        repeat: -1, 
        yoyo: true, 
        ease: 'sine.inOut' 
      }, 1.5)
      .to('.shape-2', { 
        borderRadius: '35%', 
        rotation: -135, 
        scale: 0.85, 
        duration: 2.5, 
        repeat: -1, 
        yoyo: true, 
        ease: 'sine.inOut' 
      }, 1.5)

      // 1. Text Animation: Masked letter stagger & kinetic tracking
      .to('.char', {
        y: '0%',
        opacity: 1,
        duration: 0.9,
        stagger: 0.05,
        ease: 'back.out(1.5)'
      }, 0.7)
      .to('.kinetic-title', {
        letterSpacing: '0.28em',
        duration: 2.5,
        ease: 'power1.out'
      }, 0.9)
      .to('.subtitle', {
        opacity: 1,
        y: -5,
        duration: 1
      }, 1.3);

    // ==========================================
    // CONTROLS
    // ==========================================
    document.getElementById('btn-play').addEventListener('click', () => masterTL.play());
    document.getElementById('btn-pause').addEventListener('click', () => masterTL.pause());
    document.getElementById('btn-restart').addEventListener('click', () => masterTL.restart());
  </script>
</body>
</html>
