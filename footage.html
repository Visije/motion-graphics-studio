<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GSAP Animation Playground</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.14.2/gsap.min.js"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #090d19;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* MAIN WORKSPACE */

.workspace {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* HEADER */

.header {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    background: #10182a;
    border-bottom: 1px solid #25334c;
}

.logo {
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 3px;
}

.logo span {
    color: #54dfff;
}

.status {
    font-size: 11px;
    color: #54dfff;
    letter-spacing: 2px;
}

/* ANIMATION STAGE */

.stage {
    flex: 1;
    position: relative;
    overflow: hidden;

    background:
    radial-gradient(
        circle at center,
        #172744,
        #090d19 75%
    );
}

/* GRID */

.grid {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(rgba(120,160,210,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120,160,210,.05) 1px, transparent 1px);

    background-size: 50px 50px;
}

/* OBJECTS */

.objects {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 45px;
}

/* SHAPES */

.shape {
    width: 95px;
    height: 95px;

    border-radius: 20px;

    background: linear-gradient(135deg,#54dfff,#5273ff);

    box-shadow:
    0 0 35px rgba(84,223,255,.25);
}

.shape:nth-child(2) {
    background: linear-gradient(135deg,#a27aff,#e06aff);
    border-radius: 50%;
}

.shape:nth-child(3) {
    background: linear-gradient(135deg,#5df0c3,#22bca8);
    border-radius: 8px;
}

.shape:nth-child(4) {
    background: linear-gradient(135deg,#ffbd65,#ff6b86);
    border-radius: 50% 10% 50% 10%;
}

/* LABEL */

.stage-label {
    position: absolute;
    bottom: 25px;
    left: 30px;

    color: #64758f;
    font-size: 11px;
    letter-spacing: 2px;
}

/* CONTROL PANEL */

.controls {
    height: 160px;

    background: #10182a;

    border-top: 1px solid #25334c;

    padding: 20px 30px;

    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.control-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.buttons {
    display: flex;
    gap: 10px;
}

button {
    padding: 10px 22px;

    border: 1px solid #344865;

    background: #17243b;

    color: white;

    cursor: pointer;

    border-radius: 5px;

    font-size: 11px;
    letter-spacing: 1px;

    transition: .2s;
}

button:hover {
    background: #54dfff;
    color: #090d19;
}

button.active {
    background: #54dfff;
    color: #090d19;
}

.timeline-info {
    color: #8192ad;
    font-size: 12px;
}

.timeline {
    width: 100%;
}

input[type="range"] {
    width: 100%;
    accent-color: #54dfff;
    cursor: pointer;
}

/* SPEED */

.speed-control {
    display: flex;
    align-items: center;
    gap: 12px;

    font-size: 11px;
    color: #8192ad;
}

select {
    background: #17243b;
    color: white;
    border: 1px solid #344865;
    padding: 8px;
    border-radius: 4px;
}

/* RESPONSIVE */

@media(max-width:700px) {

    .objects {
        gap: 15px;
    }

    .shape {
        width: 50px;
        height: 50px;
    }

    .controls {
        height: 190px;
    }

    .control-top {
        flex-wrap: wrap;
        gap: 15px;
    }

    button {
        padding: 9px 12px;
    }

}

</style>

</head>

<body>

<div class="workspace">

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            GSAP <span>PLAYGROUND</span>
        </div>

        <div class="status" id="status">
            READY
        </div>

    </header>


    <!-- ANIMATION STAGE -->

    <main class="stage">

        <div class="grid"></div>

        <div class="objects">

            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>

        </div>

        <div class="stage-label">
            ANIMATION CANVAS / 001
        </div>

    </main>


    <!-- CONTROLS -->

    <footer class="controls">

        <div class="control-top">

            <div class="buttons">

                <button id="play">PLAY</button>

                <button id="pause">PAUSE</button>

                <button id="reverse">REVERSE</button>

                <button id="restart">RESTART</button>

            </div>


            <div class="speed-control">

                SPEED

                <select id="speed">

                    <option value="0.5">0.5x</option>
                    <option value="1" selected>1x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>

                </select>

            </div>


            <div class="timeline-info">

                <span id="currentTime">0.00</span>
                /
                <span id="totalTime">0.00</span>

            </div>

        </div>


        <div class="timeline">

            <input
                type="range"
                id="scrubber"
                min="0"
                max="100"
                value="0"
                step="0.1"
            >

        </div>

    </footer>

</div>


<script>

// ====================================
// GSAP PLAYGROUND
// ====================================

gsap.registerPlugin();

const shapes = gsap.utils.toArray(".shape");

const status = document.getElementById("status");

const scrubber = document.getElementById("scrubber");

const currentTime = document.getElementById("currentTime");

const totalTime = document.getElementById("totalTime");

const speed = document.getElementById("speed");

let isScrubbing = false;


// ====================================
// CREATE TIMELINE
// ====================================

const tl = gsap.timeline({

    paused: true,

    repeat: -1,

    repeatDelay: 0.5,

    onUpdate: updateInterface

});


// ====================================
// ANIMATION SEQUENCE
// ====================================

// Phase 1: Entrance

tl.from(shapes, {

    y: 200,

    opacity: 0,

    scale: 0.2,

    duration: 1.2,

    stagger: 0.15,

    ease: "back.out(1.7)"

});


// Phase 2: Rotation

tl.to(shapes, {

    rotation: 360,

    duration: 2,

    stagger: 0.15,

    ease: "power2.inOut"

});


// Phase 3: Jump

tl.to(shapes, {

    y: -120,

    duration: 0.45,

    stagger: 0.12,

    ease: "power2.out"

});

tl.to(shapes, {

    y: 0,

    duration: 0.65,

    stagger: 0.12,

    ease: "bounce.out"

});


// Phase 4: Scale

tl.to(shapes, {

    scale: 1.5,

    duration: 0.7,

    stagger: 0.12,

    ease: "elastic.out(1,0.4)"

});

tl.to(shapes, {

    scale: 1,

    duration: 0.7,

    stagger: 0.12,

    ease: "power2.inOut"

});


// Phase 5: Horizontal movement

tl.to(shapes, {

    x: 180,

    duration: 1,

    stagger: 0.12,

    ease: "power3.inOut"

});

tl.to(shapes, {

    x: -180,

    duration: 1,

    stagger: 0.12,

    ease: "power3.inOut"

});


// Phase 6: Fade

tl.to(shapes, {

    opacity: 0.2,

    duration: 0.8,

    stagger: 0.12,

    ease: "power2.inOut"

});

tl.to(shapes, {

    opacity: 1,

    duration: 0.8,

    stagger: 0.12,

    ease: "power2.inOut"

});


// ====================================
// INTERFACE UPDATE
// ====================================

function updateInterface() {

    if (isScrubbing) return;

    const time = tl.time();

    const duration = tl.duration();

    currentTime.textContent = time.toFixed(2);

    totalTime.textContent = duration.toFixed(2);

    scrubber.value = (time / duration) * 100;

}


// ====================================
// PLAY
// ====================================

document.getElementById("play").onclick = () => {

    tl.play();

    status.textContent = "PLAYING";

};


// ====================================
// PAUSE
// ====================================

document.getElementById("pause").onclick = () => {

    tl.pause();

    status.textContent = "PAUSED";

};


// ====================================
// REVERSE
// ====================================

document.getElementById("reverse").onclick = () => {

    tl.reverse();

    status.textContent = "REVERSE";

};


// ====================================
// RESTART
// ====================================

document.getElementById("restart").onclick = () => {

    tl.restart();

    status.textContent = "PLAYING";

};


// ====================================
// SPEED
// ====================================

speed.onchange = () => {

    tl.timeScale(Number(speed.value));

};


// ====================================
// TIMELINE SCRUBBER
// ====================================

scrubber.addEventListener("input", () => {

    isScrubbing = true;

    const time = Number(scrubber.value) / 100 * tl.duration();

    tl.pause();

    tl.time(time);

    currentTime.textContent = time.toFixed(2);

    status.textContent = "SCRUBBING";

});


scrubber.addEventListener("change", () => {

    isScrubbing = false;

    status.textContent = "PAUSED";

    updateInterface();

});


// ====================================
// INITIALIZE
// ====================================

totalTime.textContent = tl.duration().toFixed(2);

updateInterface();

</script>

</body>
</html>
