<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Kitchen Studio</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #202326;
    font-family: Arial, sans-serif;
}

#kitchen-container {
    width: 100%;
    height: 100%;
    position: relative;
}

canvas {
    display: block;
}

.topbar {
    position: absolute;
    top: 25px;
    left: 30px;
    right: 30px;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}

.brand {
    color: white;
    font-size: 13px;
    letter-spacing: 3px;
    font-weight: bold;
}

.status {
    color: #ccc;
    font-size: 11px;
    letter-spacing: 2px;
}

.controls {
    position: absolute;
    bottom: 30px;
    right: 30px;
    display: flex;
    gap: 10px;
    z-index: 5;
}

button {
    padding: 13px 20px;
    background: rgba(20,25,30,.9);
    border: 1px solid #555;
    color: white;
    cursor: pointer;
    font-size: 11px;
    letter-spacing: 1px;
}

button:hover {
    background: white;
    color: #111;
}

.instructions {
    position: absolute;
    bottom: 38px;
    left: 30px;
    color: #bbb;
    font-size: 11px;
    letter-spacing: 1px;
    pointer-events: none;
}

#message {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #202326;
    color: white;
    z-index: 20;
    text-align: center;
    padding: 30px;
    line-height: 2;
}

#message.hidden {
    display: none;
}

@media(max-width:600px) {
    .topbar {
        left: 15px;
        right: 15px;
    }

    .controls {
        right: 15px;
        bottom: 15px;
    }

    .instructions {
        left: 15px;
        bottom: 75px;
    }
}

</style>

<!-- Three.js classic scripts -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

</head>

<body>

<div id="kitchen-container">

    <div id="message">
        Loading 3D Kitchen...
    </div>

    <div class="topbar">
        <div class="brand">KITCHEN / 3D STUDIO</div>
        <div class="status">INTERACTIVE 3D VIEW</div>
    </div>

    <div class="instructions">
        DRAG TO ROTATE · SCROLL TO ZOOM · RIGHT CLICK TO PAN
    </div>

    <div class="controls">
        <button id="reset">RESET VIEW</button>
        <button id="lights">LIGHTS ON</button>
    </div>

</div>


<script>

(function() {

"use strict";

const container = document.getElementById("kitchen-container");
const message = document.getElementById("message");

function showError(text) {
    message.classList.remove("hidden");
    message.innerHTML = text;
}

try {

    // CHECK LIBRARIES

    if (!window.THREE) {
        throw new Error("Three.js failed to load. Check your internet connection.");
    }

    if (!THREE.OrbitControls) {
        throw new Error("OrbitControls failed to load.");
    }


    // SCENE

    const scene = new THREE.Scene();

    scene.background = new THREE.Color("#303438");


    // CAMERA

    const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    camera.position.set(9, 7, 11);


    // RENDERER

    const renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    renderer.outputEncoding = THREE.sRGBEncoding;

    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure = 1.25;

    container.appendChild(renderer.domElement);


    // CONTROLS

    const controls = new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    controls.minDistance = 4;
    controls.maxDistance = 20;

    controls.maxPolarAngle = Math.PI / 2.02;

    controls.target.set(0, 1.2, -0.5);


    // MATERIALS

    function material(color, roughness = 0.6, metalness = 0) {

        return new THREE.MeshStandardMaterial({
            color,
            roughness,
            metalness
        });

    }

    const wallMat = material("#d9d4ca");
    const floorMat = material("#777a78", 0.8);
    const cabinetMat = material("#b9a991");
    const darkMat = material("#343b3e");
    const counterMat = material("#292d30", 0.25);
    const metalMat = material("#b7c0c3", 0.25, 0.8);
    const blackMat = material("#15191b", 0.2);
    const glassMat = material("#a4bdc4", 0.2, 0.3);
    const woodMat = material("#795a40");


    // BOX CREATION

    function box(name, x, y, z, w, h, d, mat) {

        const mesh = new THREE.Mesh(
            new THREE.BoxGeometry(w, h, d),
            mat
        );

        mesh.name = name;

        mesh.position.set(x, y, z);

        mesh.castShadow = true;
        mesh.receiveShadow = true;

        scene.add(mesh);

        return mesh;

    }


    // LIGHTING

    scene.add(
        new THREE.HemisphereLight(
            0xffffff,
            0x555555,
            1.5
        )
    );

    const sun = new THREE.DirectionalLight(
        0xffe5c2,
        2.5
    );

    sun.position.set(5, 10, 7);
    sun.castShadow = true;

    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;

    scene.add(sun);


    const ceilingLight = new THREE.PointLight(
        0xffd8a0,
        2.5,
        15
    );

    ceilingLight.position.set(0, 3.1, -0.5);

    scene.add(ceilingLight);


    // ROOM

    box(
        "Floor",
        0, -0.12, 0,
        10, 0.2, 8,
        floorMat
    );

    box(
        "Back Wall",
        0, 1.65, -4,
        10, 3.3, 0.2,
        wallMat
    );

    box(
        "Left Wall",
        -5, 1.65, 0,
        0.2, 3.3, 8,
        wallMat
    );


    // FLOOR GRID

    const grid = new THREE.GridHelper(
        10,
        10,
        0x777777,
        0x555555
    );

    grid.position.y = -0.012;

    scene.add(grid);


    // BASE CABINETS

    for (let i = 0; i < 8; i++) {

        const x = -3.6 + i * 0.95;

        box(
            "Base Cabinet",
            x, 0.43, -3.45,
            0.95, 0.86, 0.85,
            cabinetMat
        );

        box(
            "Cabinet Front",
            x, 0.44, -3.01,
            0.86, 0.72, 0.035,
            darkMat
        );

        box(
            "Cabinet Handle",
            x + 0.32, 0.44, -2.98,
            0.035, 0.18, 0.035,
            metalMat
        );

    }


    // COUNTERTOP

    box(
        "Granite Countertop",
        -0.1, 0.92, -3.42,
        8.5, 0.12, 1.05,
        counterMat
    );


    // WALL CABINETS

    for (let i = 0; i < 7; i++) {

        const x = -3.35 + i * 1.05;

        box(
            "Wall Cabinet",
            x, 2.35, -3.65,
            0.95, 0.85, 0.55,
            cabinetMat
        );

        box(
            "Wall Cabinet Front",
            x, 2.35, -3.36,
            0.87, 0.76, 0.035,
            darkMat
        );

        box(
            "Wall Cabinet Handle",
            x + 0.32, 2.35, -3.33,
            0.035, 0.16, 0.035,
            metalMat
        );

    }


    // BACKSPLASH

    box(
        "Backsplash",
        -0.1, 1.42, -3.87,
        8.4, 0.55, 0.025,
        glassMat
    );


    // SINK

    box(
        "Sink",
        -1.6, 0.98, -3.4,
        0.9, 0.04, 0.55,
        blackMat
    );

    box(
        "Sink Basin",
        -1.6, 1.005, -3.4,
        0.72, 0.015, 0.38,
        metalMat
    );

    // Faucet

    const faucet = new THREE.Mesh(
        new THREE.TorusGeometry(0.15, 0.025, 12, 32, Math.PI),
        metalMat
    );

    faucet.rotation.z = Math.PI;
    faucet.position.set(-1.6, 1.25, -3.15);

    scene.add(faucet);


    // COOKTOP

    box(
        "Cooktop",
        1.5, 0.99, -3.4,
        1.3, 0.04, 0.7,
        blackMat
    );

    for (let x of [1.2, 1.8]) {

        for (let z of [-3.58, -3.22]) {

            const burner = new THREE.Mesh(
                new THREE.CylinderGeometry(
                    0.16, 0.16, 0.015, 32
                ),
                metalMat
            );

            burner.position.set(x, 1.02, z);

            scene.add(burner);

        }

    }


    // CHIMNEY

    box(
        "Chimney",
        1.5, 2.05, -3.7,
        1.2, 0.65, 0.35,
        metalMat
    );

    box(
        "Chimney Hood",
        1.5, 1.65, -3.55,
        1.6, 0.12, 0.8,
        metalMat
    );


    // REFRIGERATOR

    box(
        "Refrigerator",
        4.25, 1.1, -3.2,
        0.9, 2.2, 0.85,
        metalMat
    );

    box(
        "Fridge Door",
        4.25, 1.15, -2.75,
        0.84, 2.0, 0.04,
        glassMat
    );

    box(
        "Fridge Handle",
        3.9, 1.25, -2.71,
        0.035, 0.65, 0.035,
        blackMat
    );


    // KITCHEN ISLAND

    box(
        "Island Body",
        0, 0.45, -0.2,
        2.8, 0.9, 1.2,
        darkMat
    );

    box(
        "Island Counter",
        0, 0.95, -0.2,
        3, 0.12, 1.4,
        counterMat
    );

    for (let x of [-0.9, 0, 0.9]) {

        box(
            "Island Door",
            x, 0.45, 0.41,
            0.82, 0.72, 0.035,
            cabinetMat
        );

        box(
            "Island Handle",
            x + 0.3, 0.45, 0.44,
            0.035, 0.16, 0.035,
            metalMat
        );

    }


    // PENDANT LIGHTS

    for (let x of [-0.8, 0.8]) {

        box(
            "Pendant Wire",
            x, 2.85, -0.2,
            0.025, 0.45, 0.025,
            blackMat
        );

        const shade = new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.25, 0.4, 0.25, 32
            ),
            blackMat
        );

        shade.position.set(x, 2.58, -0.2);

        scene.add(shade);

    }


    // DECORATION

    const fruitColors = [
        "#d94835",
        "#e9b83c",
        "#5b9b50"
    ];

    fruitColors.forEach((color, i) => {

        const fruit = new THREE.Mesh(
            new THREE.SphereGeometry(0.09, 20, 20),
            material(color, 0.4)
        );

        fruit.position.set(
            -0.5 + i * 0.12,
            1.2,
            0
        );

        scene.add(fruit);

    });


    // CAMERA RESET

    document.getElementById("reset").onclick = () => {

        camera.position.set(9, 7, 11);

        controls.target.set(0, 1.2, -0.5);

        controls.update();

    };


    // LIGHT CONTROL

    let lightsOn = true;

    document.getElementById("lights").onclick = function() {

        lightsOn = !lightsOn;

        ceilingLight.visible = lightsOn;

        sun.intensity = lightsOn ? 2.5 : 0.5;

        this.textContent = lightsOn
            ? "LIGHTS ON"
            : "LIGHTS OFF";

    };


    // RESPONSIVE

    window.addEventListener("resize", () => {

        camera.aspect =
            window.innerWidth / window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    });


    // RENDER

    function animate() {

        requestAnimationFrame(animate);

        controls.update();

        renderer.render(scene, camera);

    }

    animate();


    // SUCCESS

    message.classList.add("hidden");

    console.log("3D Kitchen initialized successfully.");

} catch(error) {

    console.error(error);

    showError(
        "3D KITCHEN FAILED TO LOAD<br><br>" +
        error.message +
        "<br><br>Check your internet connection and browser WebGL support."
    );

}

})();

</script>

</body>
</html>
