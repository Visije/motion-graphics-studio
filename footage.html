<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Bottle Model</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #f0efe9;
}

.stage {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.bottle {
    width: 300px;
    height: 540px;
    max-height: 95vh;
}

svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}
</style>
</head>

<body>

<div class="stage">

<div class="bottle">

<svg viewBox="0 0 300 540"
     xmlns="http://www.w3.org/2000/svg">

<defs>

    <!-- Dark glass body -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">

        <stop offset="0%" stop-color="#080909"/>
        <stop offset="8%" stop-color="#343638"/>
        <stop offset="18%" stop-color="#111213"/>
        <stop offset="45%" stop-color="#090a0b"/>
        <stop offset="72%" stop-color="#17191a"/>
        <stop offset="91%" stop-color="#303234"/>
        <stop offset="100%" stop-color="#080909"/>

    </linearGradient>

    <!-- Neck glass -->
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="0">

        <stop offset="0%" stop-color="#090909"/>
        <stop offset="20%" stop-color="#343436"/>
        <stop offset="50%" stop-color="#080808"/>
        <stop offset="85%" stop-color="#29292a"/>
        <stop offset="100%" stop-color="#080808"/>

    </linearGradient>

    <!-- Gold foil -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">

        <stop offset="0%" stop-color="#80601e"/>
        <stop offset="15%" stop-color="#c69c43"/>
        <stop offset="35%" stop-color="#f5df8b"/>
        <stop offset="55%" stop-color="#b18a35"/>
        <stop offset="75%" stop-color="#f1d57c"/>
        <stop offset="100%" stop-color="#80601e"/>

    </linearGradient>

    <!-- Metallic label -->
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="0">

        <stop offset="0%" stop-color="#424548"/>
        <stop offset="20%" stop-color="#73777a"/>
        <stop offset="50%" stop-color="#55595b"/>
        <stop offset="80%" stop-color="#777b7c"/>
        <stop offset="100%" stop-color="#393d3f"/>

    </linearGradient>

    <!-- Gold typography -->
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">

        <stop offset="0%" stop-color="#fff0ad"/>
        <stop offset="50%" stop-color="#d5ae53"/>
        <stop offset="100%" stop-color="#9e742b"/>

    </linearGradient>

    <!-- Glass reflection -->
    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="0">

        <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="50%" stop-color="#ffffff" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>

    </linearGradient>

    <!-- Ground shadow -->
    <filter id="shadow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- Bottle clipping -->
    <clipPath id="bodyClip">
        <path d="
            M132 198
            L132 143
            L168 143
            L168 198
            C168 212 184 220 195 234
            C207 249 210 264 210 286
            L210 500
            Q210 520 190 520
            L110 520
            Q90 520 90 500
            L90 286
            C90 264 93 249 105 234
            C116 220 132 212 132 198
            Z
        "/>
    </clipPath>

</defs>


<!-- FLOOR SHADOW -->

<ellipse
    cx="150"
    cy="523"
    rx="70"
    ry="6"
    fill="#77766e"
    opacity="0.22"
    filter="url(#shadow)"
/>


<!-- MAIN BOTTLE BODY -->

<path
    d="
        M132 198
        L132 143
        L168 143
        L168 198
        C168 212 184 220 195 234
        C207 249 210 264 210 286
        L210 500
        Q210 520 190 520
        L110 520
        Q90 520 90 500
        L90 286
        C90 264 93 249 105 234
        C116 220 132 212 132 198
        Z
    "
    fill="url(#glass)"
    stroke="#111213"
    stroke-width="1.5"
/>


<!-- NECK GLASS -->

<path
    d="
        M132 140
        L132 198
        C132 212 116 220 105 234
        M168 140
        L168 198
        C168 212 184 220 195 234
    "
    fill="none"
    stroke="url(#neck)"
    stroke-width="2"
/>


<!-- GOLD FOIL NECK -->

<path
    d="
        M132 56
        Q132 49 139 49
        L161 49
        Q168 49 168 56
        L168 143
        L132 143
        Z
    "
    fill="url(#gold)"
    stroke="#94712d"
    stroke-width="1"
/>


<!-- GOLD CAP TOP -->

<path
    d="
        M132 57
        Q132 46 140 46
        L160 46
        Q168 46 168 57
        L168 64
        L132 64
        Z
    "
    fill="url(#gold)"
/>


<!-- FOIL HIGHLIGHTS -->

<path d="M137 61 L137 133"
      stroke="#fff0b2"
      stroke-width="3"
      opacity="0.6"/>

<path d="M163 61 L163 133"
      stroke="#76561c"
      stroke-width="2"
      opacity="0.7"/>


<!-- FOIL BOTTOM RINGS -->

<path d="M132 134 H168"
      stroke="#76551d"
      stroke-width="2"/>

<path d="M132 140 H168"
      stroke="#e8cb77"
      stroke-width="2"/>


<!-- DARK NECK SECTION -->

<path
    d="
        M132 145
        L168 145
        L168 198
        C168 211 180 218 180 218
        L120 218
        C120 218 132 211 132 198
        Z
    "
    fill="url(#neck)"
/>


<!-- GLASS SHOULDER REFLECTION -->

<path
    d="
        M110 232
        Q96 247 96 280
        L96 490
    "
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    opacity="0.12"
/>

<path
    d="
        M190 232
        Q204 247 204 280
        L204 490
    "
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    opacity="0.13"
/>


<!-- LABEL -->

<g clip-path="url(#bodyClip)">

    <rect
        x="91"
        y="284"
        width="118"
        height="177"
        fill="url(#label)"
    />

    <!-- Label texture -->
    <path d="M94 286 V460"
          stroke="#ffffff"
          stroke-width="1"
          opacity="0.12"/>

    <path d="M207 286 V460"
          stroke="#000000"
          stroke-width="1"
          opacity="0.25"/>

</g>


<!-- LABEL TOP TEXT -->

<text
    x="150"
    y="316"
    text-anchor="middle"
    font-size="5"
    letter-spacing="1"
    fill="url(#goldText)"
>
    PERFECTLY EXCLUSIVE
</text>


<!-- LABEL MAIN TEXT -->

<text
    x="150"
    y="345"
    text-anchor="middle"
    font-size="7"
    letter-spacing="1"
    fill="#e8dfc6"
>
    LONG NECK
</text>

<text
    x="150"
    y="362"
    text-anchor="middle"
    font-family="Arial"
    font-weight="bold"
    font-size="17"
    letter-spacing="0.5"
    fill="url(#goldText)"
>
    BOTTLE
</text>

<text
    x="150"
    y="375"
    text-anchor="middle"
    font-size="8"
    letter-spacing="1"
    fill="#e9ca72"
>
    MOCKUP
</text>


<!-- LABEL DESCRIPTION -->

<text
    x="150"
    y="401"
    text-anchor="middle"
    font-size="4.5"
    fill="#eeeeee"
>
    <tspan x="150" dy="0">Premium elegance crafted</tspan>
    <tspan x="150" dy="7">with timeless design and</tspan>
    <tspan x="150" dy="7">sophisticated detailing.</tspan>
    <tspan x="150" dy="7">A statement of style.</tspan>
</text>


<!-- LABEL DECORATIVE ORNAMENT -->

<g
    transform="translate(150 438)"
    stroke="#c6a65c"
    stroke-width="0.7"
    fill="none"
    opacity="0.9"
>

    <path d="M-34 0 Q-17 -16 0 0 Q17 -16 34 0"/>

    <path d="M-28 5 Q-14 -8 0 5 Q14 -8 28 5"/>

    <path d="M0 -9 V11"/>

    <circle cx="0" cy="0" r="3"/>

</g>


<text
    x="150"
    y="455"
    text-anchor="middle"
    font-size="4.5"
    letter-spacing="0.5"
    fill="#e4dfd1"
>
    PREMIUM GLASS COLLECTION
</text>


<!-- BODY REFLECTIONS -->

<path
    d="
        M99 285
        Q94 340 98 450
    "
    fill="none"
    stroke="url(#reflection)"
    stroke-width="7"
    opacity="0.6"
/>


<!-- BOTTOM BASE REFLECTION -->

<path
    d="
        M94 505
        Q150 516 206 505
    "
    fill="none"
    stroke="#9b9fa0"
    stroke-width="2"
    opacity="0.5"
/>


<!-- GLASS BASE -->

<path
    d="
        M94 515
        Q150 527 206 515
    "
    fill="none"
    stroke="#333637"
    stroke-width="3"
/>

</svg>

</div>

</div>

</body>
</html>
