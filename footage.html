<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Kitchen Visualization</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #151719;
    font-family: Arial, sans-serif;
}

#kitchen-container {
    width: 100vw;
    height: 100vh;
    position: relative;
}

canvas {
    display: block;
}

/* TOP BAR */

.topbar {
    position: absolute;
    top: 25px;
    left: 30px;
    right: 30px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 10;
    pointer-events: none;
}

.brand {
    color: white;
    font-size: 13px;
    letter-spacing: 3px;
    font-weight: bold;
}

.view-label {
    color: #c6c6c6;
    font-size: 11px;
    letter-spacing: 2px;
}

/* CONTROL PANEL */

.controls {
    position: absolute;
    bottom: 30px;
    right: 30px;

    display: flex;
    gap: 10px;

    z-index: 10;
}

.controls button {
    padding: 13px 20px;

    border: 1px solid rgba(255,255,255,0.2);

    background: rgba(20,25,30,0.85);

    color: white;

    cursor: pointer;

    font-size: 11px;
    letter-spacing: 1px;

    transition: 0.3s;
}

.controls button:hover {
    background: #ffffff;
    color: #111;
}

/* INSTRUCTIONS */

.instructions {
    position: absolute;
    bottom: 35px;
    left: 30px;

    color: rgba(255,255,255,0.6);

    font-size: 11px;
    letter-spacing: 1px;

    pointer-events: none;
}

/* LOADING */

.loading {
    position: absolute;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;
    background: #151719;

    z-index: 20;

    letter-spacing: 3px;
    font-size: 12px;

    transition: opacity 0.5s;
}

.loading.hidden {
    opacity: 0;
    pointer-events: none;
}

@media(max-width:600px) {

    .topbar {
        left: 15px;
        right: 15px;
    }

    .controls {
        right: 15px;
        bottom: 15px;
    }

    .instructions {
        left: 15px;
        bottom: 75px;
    }

}

</style>

</head>

<body>

<div id="kitchen-container">

    <div class="loading" id="loading">
        BUILDING 3D KITCHEN...
    </div>

    <div class="topbar">

        <div class="brand">
            KITCHEN / 3D STUDIO
        </div>

        <div class="view-label">
            INTERACTIVE ARCHITECTURAL VIEW
        </div>

    </div>

    <div class="instructions">
        DRAG TO ROTATE · SCROLL TO ZOOM · RIGHT CLICK TO PAN
    </div>

    <div class="controls">

        <button id="reset">
            RESET VIEW
        </button>

        <button id="lights">
            LIGHTS ON
        </button>

    </div>

</div>


<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';


// ======================================
// SCENE
// ======================================

const container = document.getElementById(
    "kitchen-container"
);

const scene = new THREE.Scene();

scene.background = new THREE.Color("#25292b");


// ======================================
// CAMERA
// ======================================

const camera = new THREE.PerspectiveCamera(

    45,

    window.innerWidth / window.innerHeight,

    0.1,

    1000

);

camera.position.set(9, 7, 10);

camera.lookAt(0, 1.2, -0.5);


// ======================================
// RENDERER
// ======================================

const renderer = new THREE.WebGLRenderer({

    antialias: true

});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.2;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

container.appendChild(renderer.domElement);


// ======================================
// ORBIT CONTROLS
// ======================================

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.06;

controls.minDistance = 4;

controls.maxDistance = 22;

controls.maxPolarAngle = Math.PI / 2.02;

controls.target.set(0, 1.2, -0.5);


// ======================================
// MATERIALS
// ======================================

const materials = {

    wall: new THREE.MeshStandardMaterial({
        color: "#d9d5cd",
        roughness: 0.9
    }),

    floor: new THREE.MeshStandardMaterial({
        color: "#777a78",
        roughness: 0.7
    }),

    cabinet: new THREE.MeshStandardMaterial({
        color: "#c5b9a4",
        roughness: 0.55
    }),

    darkCabinet: new THREE.MeshStandardMaterial({
        color: "#444b4c",
        roughness: 0.45
    }),

    countertop: new THREE.MeshStandardMaterial({
        color: "#292d30",
        roughness: 0.2
    }),

    metal: new THREE.MeshStandardMaterial({
        color: "#aeb6ba",
        metalness: 0.85,
        roughness: 0.22
    }),

    black: new THREE.MeshStandardMaterial({
        color: "#16191b",
        roughness: 0.25
    }),

    glass: new THREE.MeshStandardMaterial({
        color: "#a8c9d4",
        metalness: 0.25,
        roughness: 0.15
    }),

    wood: new THREE.MeshStandardMaterial({
        color: "#8b6244",
        roughness: 0.65
    })

};


// ======================================
// GEOMETRY HELPER
// ======================================

function box(
    name,
    x, y, z,
    width, height, depth,
    material,
    cast = true,
    receive = true
) {

    const geometry = new THREE.BoxGeometry(
        width,
        height,
        depth
    );

    const mesh = new THREE.Mesh(
        geometry,
        material
    );

    mesh.name = name;

    mesh.position.set(x, y, z);

    mesh.castShadow = cast;

    mesh.receiveShadow = receive;

    scene.add(mesh);

    return mesh;

}


// ======================================
// LIGHTING
// ======================================

// Ambient light

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x666666,
    2
);

scene.add(ambient);


// Main sunlight

const sunlight = new THREE.DirectionalLight(
    0xffead0,
    3
);

sunlight.position.set(5, 10, 6);

sunlight.castShadow = true;

sunlight.shadow.mapSize.set(2048, 2048);

sunlight.shadow.camera.left = -10;
sunlight.shadow.camera.right = 10;
sunlight.shadow.camera.top = 10;
sunlight.shadow.camera.bottom = -10;

scene.add(sunlight);


// Kitchen ceiling light

const ceilingLight = new THREE.PointLight(
    0xffdfb0,
    35,
    12
);

ceilingLight.position.set(0, 3.1, 0);

scene.add(ceilingLight);


// ======================================
// ROOM
// ======================================

// Floor

box(
    "Kitchen Floor",
    0, -0.12, 0,
    10, 0.2, 8,
    materials.floor
);


// Back wall

box(
    "Back Wall",
    0, 1.65, -4,
    10, 3.3, 0.2,
    materials.wall
);


// Left wall

box(
    "Left Wall",
    -5, 1.65, 0,
    0.2, 3.3, 8,
    materials.wall
);


// Floor tile lines

const tileMaterial = new THREE.LineBasicMaterial({

    color: "#999d9b",
    transparent: true,
    opacity: 0.25

});

const tilePoints = [];

for (let x = -5; x <= 5; x += 1) {

    tilePoints.push(
        new THREE.Vector3(x, -0.015, -4),
        new THREE.Vector3(x, -0.015, 4)
    );

}

for (let z = -4; z <= 4; z += 1) {

    tilePoints.push(
        new THREE.Vector3(-5, -0.015, z),
        new THREE.Vector3(5, -0.015, z)
    );

}

const tileGeometry = new THREE.BufferGeometry()
    .setFromPoints(tilePoints);

const tileLines = new THREE.LineSegments(
    tileGeometry,
    tileMaterial
);

scene.add(tileLines);


// ======================================
// BASE CABINETS
// ======================================

function createBaseCabinet(x) {

    // Cabinet body

    box(
        "Base Cabinet",
        x, 0.43, -3.45,
        0.95, 0.86, 0.85,
        materials.cabinet
    );

    // Door panel

    box(
        "Cabinet Door",
        x, 0.44, -3.012,
        0.86, 0.72, 0.035,
        materials.darkCabinet
    );

    // Handle

    box(
        "Cabinet Handle",
        x + 0.32, 0.45, -2.982,
        0.035, 0.18, 0.035,
        materials.metal
    );

}

for (let i = 0; i < 8; i++) {

    createBaseCabinet(-3.6 + i * 0.95);

}


// ======================================
// COUNTERTOP
// ======================================

box(
    "Granite Countertop",
    -0.1, 0.92, -3.42,
    8.5, 0.12, 1.05,
    materials.countertop
);


// Countertop edge

box(
    "Countertop Front Edge",
    -0.1, 0.88, -2.89,
    8.5, 0.08, 0.035,
    materials.metal
);


// ======================================
// WALL CABINETS
// ======================================

function createWallCabinet(x) {

    box(
        "Wall Cabinet",
        x, 2.35, -3.65,
        0.95, 0.85, 0.55,
        materials.cabinet
    );

    box(
        "Wall Cabinet Door",
        x, 2.35, -3.36,
        0.87, 0.76, 0.035,
        materials.darkCabinet
    );

    box(
        "Wall Cabinet Handle",
        x + 0.32, 2.35, -3.33,
        0.035, 0.16, 0.035,
        materials.metal
    );

}

for (let i = 0; i < 7; i++) {

    createWallCabinet(-3.35 + i * 1.05);

}


// ======================================
// BACKSPLASH
// ======================================

box(
    "Kitchen Backsplash",
    -0.1, 1.42, -3.87,
    8.4, 0.55, 0.025,
    materials.glass,
    false,
    false
);


// ======================================
// KITCHEN SINK
// ======================================

// Basin

box(
    "Kitchen Sink",
    -1.6, 0.97, -3.4,
    0.9, 0.045, 0.55,
    materials.black
);


// Basin inner surface

box(
    "Sink Interior",
    -1.6, 0.99, -3.4,
    0.75, 0.015, 0.4,
    materials.metal
);


// Faucet base

const faucetBase = new THREE.Mesh(

    new THREE.CylinderGeometry(
        0.045, 0.045, 0.12, 24
    ),

    materials.metal

);

faucetBase.position.set(-1.6, 1.05, -3.02);

scene.add(faucetBase);


// Faucet pipe

const faucetCurve = new THREE.CatmullRomCurve3([

    new THREE.Vector3(-1.6, 1.08, -3.02),

    new THREE.Vector3(-1.6, 1.38, -3.02),

    new THREE.Vector3(-1.6, 1.45, -3.12),

    new THREE.Vector3(-1.6, 1.35, -3.22)

]);

const faucet = new THREE.Mesh(

    new THREE.TubeGeometry(
        faucetCurve,
        32,
        0.025,
        12,
        false
    ),

    materials.metal

);

scene.add(faucet);


// ======================================
// COOKTOP
// ======================================

box(
    "Induction Cooktop",
    1.5, 0.99, -3.4,
    1.3, 0.04, 0.7,
    materials.black
);


// Cooking zones

for (let x = 1.2; x <= 1.8; x += 0.6) {

    for (let z = -3.58; z <= -3.22; z += 0.36) {

        const burner = new THREE.Mesh(

            new THREE.CylinderGeometry(
                0.17, 0.17, 0.012, 32
            ),

            materials.metal

        );

        burner.position.set(x, 1.02, z);

        scene.add(burner);

    }

}


// ======================================
// KITCHEN CHIMNEY
// ======================================

box(
    "Chimney Body",
    1.5, 2.05, -3.7,
    1.2, 0.65, 0.35,
    materials.metal
);


box(
    "Chimney Hood",
    1.5, 1.65, -3.55,
    1.6, 0.12, 0.8,
    materials.metal
);


// ======================================
// REFRIGERATOR
// ======================================

box(
    "Refrigerator Body",
    4.25, 1.1, -3.2,
    0.9, 2.2, 0.85,
    materials.metal
);


// Refrigerator door

box(
    "Refrigerator Door",
    4.25, 1.15, -2.75,
    0.84, 2.0, 0.04,
    materials.glass
);


// Refrigerator handle

box(
    "Refrigerator Handle",
    3.9, 1.25, -2.71,
    0.035, 0.65, 0.035,
    materials.black
);


// ======================================
// KITCHEN ISLAND
// ======================================

// Island body

box(
    "Kitchen Island",
    0, 0.45, -0.2,
    2.8, 0.9, 1.2,
    materials.darkCabinet
);


// Island countertop

box(
    "Island Granite",
    0, 0.95, -0.2,
    3.0, 0.12, 1.4,
    materials.countertop
);


// Island cabinet doors

for (let x = -0.9; x <= 0.9; x += 0.9) {

    box(
        "Island Cabinet Door",
        x, 0.45, 0.41,
        0.82, 0.72, 0.035,
        materials.cabinet
    );

    box(
        "Island Handle",
        x + 0.3, 0.45, 0.44,
        0.035, 0.16, 0.035,
        materials.metal
    );

}


// ======================================
// PENDANT LIGHTS
// ======================================

function createPendant(x) {

    // Cable

    box(
        "Pendant Cable",
        x, 2.85, -0.2,
        0.025, 0.45, 0.025,
        materials.black
    );

    // Lamp shade

    const shade = new THREE.Mesh(

        new THREE.CylinderGeometry(
            0.25, 0.4, 0.25, 32
        ),

        materials.black

    );

    shade.position.set(x, 2.58, -0.2);

    scene.add(shade);


    const light = new THREE.PointLight(
        0xffd9a0,
        20,
        4
    );

    light.position.set(x, 2.4, -0.2);

    scene.add(light);

}

createPendant(-0.8);
createPendant(0.8);


// ======================================
// DECORATIVE OBJECTS
// ======================================

// Fruit bowl

const bowl = new THREE.Mesh(

    new THREE.SphereGeometry(
        0.2, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2
    ),

    materials.metal

);

bowl.position.set(-0.4, 1.1, 0);

scene.add(bowl);


// Fruits

const fruitColors = [
    "#d94835",
    "#e9b83c",
    "#5b9b50"
];

for (let i = 0; i < 3; i++) {

    const fruit = new THREE.Mesh(

        new THREE.SphereGeometry(0.09, 20, 20),

        new THREE.MeshStandardMaterial({
            color: fruitColors[i],
            roughness: 0.4
        })

    );

    fruit.position.set(
        -0.5 + i * 0.12,
        1.2,
        0
    );

    scene.add(fruit);

}


// ======================================
// LIGHT CONTROL
// ======================================

let lightsOn = true;

document.getElementById("lights").onclick = function() {

    lightsOn = !lightsOn;

    ceilingLight.intensity = lightsOn ? 35 : 0;

    this.textContent = lightsOn
        ? "LIGHTS ON"
        : "LIGHTS OFF";

};


// ======================================
// RESET CAMERA
// ======================================

document.getElementById("reset").onclick = function() {

    camera.position.set(9, 7, 10);

    controls.target.set(0, 1.2, -0.5);

    controls.update();

};


// ======================================
// RESPONSIVE
// ======================================

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});


// ======================================
// RENDER LOOP
// ======================================

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene, camera);

}

animate();


// Remove loading screen

window.addEventListener("load", () => {

    document.getElementById("loading")
        .classList.add("hidden");

});

setTimeout(() => {

    document.getElementById("loading")
        .classList.add("hidden");

}, 5000);

</script>

</body>
</html>
