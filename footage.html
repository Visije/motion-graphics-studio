<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GSAP Motion Playground</title>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.14.2/gsap.min.js"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080b14;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* MAIN STAGE */

.stage {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:
    radial-gradient(
        circle at center,
        #172440,
        #080b14 75%
    );

}

/* GRID */

.grid {

    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(rgba(130,160,210,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(130,160,210,.045) 1px, transparent 1px);

    background-size: 60px 60px;

}

/* HEADER */

.header {

    position: absolute;

    top: 30px;
    left: 45px;
    right: 45px;

    display: flex;
    justify-content: space-between;

    z-index: 20;

    font-size: 11px;
    letter-spacing: 3px;

    color: #8194b2;

}

/* MAIN CONTENT */

.composition {

    position: absolute;

    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

}

/* TYPOGRAPHY */

.title {

    position: absolute;

    font-size: clamp(60px, 12vw, 180px);

    font-weight: 900;

    letter-spacing: 12px;

    white-space: nowrap;

    z-index: 5;

}

.title span {

    display: inline-block;

    opacity: 0;

}

/* SUBTITLE */

.subtitle {

    position: absolute;

    top: 63%;

    font-size: 13px;

    letter-spacing: 6px;

    color: #9db0cc;

    opacity: 0;

}

/* SHAPES */

.shape {

    position: absolute;

    width: 180px;
    height: 180px;

    border: 2px solid #54dfff;

    opacity: 0;

}

.circle {

    border-radius: 50%;

}

.square {

    border-color: #9b7aff;

}

.diamond {

    border-color: #ff79bd;

    transform: rotate(45deg);

}

/* GLOW */

.glow {

    position: absolute;

    width: 300px;
    height: 300px;

    background: #38bfff;

    filter: blur(140px);

    opacity: .2;

}

/* PARTICLES */

.particle {

    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #83e7ff;

    box-shadow: 0 0 10px #54dfff;

}

/* CONTROLS */

.controls {

    position: absolute;

    bottom: 35px;
    left: 45px;

    display: flex;
    gap: 12px;

    z-index: 30;

}

button {

    background: transparent;

    border: 1px solid #344665;

    color: white;

    padding: 12px 22px;

    cursor: pointer;

    font-size: 10px;

    letter-spacing: 2px;

    transition: .3s;

}

button:hover {

    background: #54dfff;

    color: #080b14;

    border-color: #54dfff;

}

/* TIMELINE */

.timeline {

    position: absolute;

    bottom: 45px;
    right: 45px;

    width: 25%;

    height: 3px;

    background: #29354c;

    z-index: 30;

}

.timeline-progress {

    width: 0%;
    height: 100%;

    background: #54dfff;

    box-shadow: 0 0 10px #54dfff;

}

/* RESPONSIVE */

@media(max-width:700px) {

    .title {
        letter-spacing: 4px;
    }

    .header {
        left: 20px;
        right: 20px;
    }

    .controls {
        left: 20px;
        bottom: 20px;
    }

    .timeline {
        display: none;
    }

}

</style>

</head>

<body>

<div class="stage">

    <div class="grid"></div>

    <div class="glow" id="glow"></div>

    <div class="header">

        <div>GSAP / MOTION LAB</div>

        <div>EXPERIMENT 001</div>

    </div>


    <div class="composition">

        <div class="shape circle" id="circle"></div>

        <div class="shape square" id="square"></div>

        <div class="shape diamond" id="diamond"></div>


        <h1 class="title" id="title">

            <span>M</span><span>O</span><span>T</span>
            <span>I</span><span>O</span><span>N</span>

        </h1>


        <div class="subtitle" id="subtitle">

            DESIGN WITHOUT LIMITS

        </div>

    </div>


    <div id="particles"></div>


    <div class="controls">

        <button id="play">PLAY</button>

        <button id="pause">PAUSE</button>

        <button id="restart">RESTART</button>

    </div>


    <div class="timeline">

        <div class="timeline-progress" id="progress"></div>

    </div>

</div>


<script>

// ==================================
// PARTICLE GENERATION
// ==================================

const particleContainer =
document.getElementById("particles");

for (let i = 0; i < 70; i++) {

    const particle = document.createElement("div");

    particle.className = "particle";

    particle.style.left = Math.random() * 100 + "%";

    particle.style.top = Math.random() * 100 + "%";

    particleContainer.appendChild(particle);

}


// ==================================
// GSAP REFERENCES
// ==================================

const titleLetters =
document.querySelectorAll(".title span");

const circle =
document.getElementById("circle");

const square =
document.getElementById("square");

const diamond =
document.getElementById("diamond");

const subtitle =
document.getElementById("subtitle");

const glow =
document.getElementById("glow");

const particles =
document.querySelectorAll(".particle");

const progress =
document.getElementById("progress");


// ==================================
// MASTER TIMELINE
// ==================================

const master = gsap.timeline({

    paused: true,

    defaults: {
        ease: "power3.out"
    }

});


// ==================================
// SCENE 01
// TYPOGRAPHY REVEAL
// ==================================

master.fromTo(

    titleLetters,

    {
        y: 150,
        opacity: 0,
        rotationX: -90,
        scale: 0.5
    },

    {
        y: 0,
        opacity: 1,
        rotationX: 0,
        scale: 1,

        duration: 1.2,

        stagger: 0.12

    },

    0

);


// ==================================
// SCENE 02
// GEOMETRIC ANIMATION
// ==================================

master.to(circle, {

    opacity: 0.8,

    scale: 1.8,

    rotation: 180,

    duration: 2

}, 0.5);


master.to(square, {

    opacity: 0.7,

    scale: 1.5,

    rotation: 225,

    duration: 2

}, 0.8);


master.to(diamond, {

    opacity: 0.7,

    scale: 1.3,

    rotation: 135,

    duration: 2

}, 1);


// ==================================
// SCENE 03
// SUBTITLE
// ==================================

master.to(subtitle, {

    opacity: 1,

    y: 20,

    duration: 1

}, 2.5);


// ==================================
// SCENE 04
// CINEMATIC MOVEMENT
// ==================================

master.to(titleLetters, {

    scale: 1.2,

    letterSpacing: 20,

    duration: 1.5

}, 4);


master.to(glow, {

    scale: 2,

    opacity: 0.35,

    duration: 2

}, 3);


// ==================================
// SCENE 05
// PARTICLES
// ==================================

particles.forEach((particle, i) => {

    master.fromTo(

        particle,

        {
            y: 100,
            opacity: 0
        },

        {
            y: -150,
            opacity: 0.9,

            duration: 2 + Math.random(),

            ease: "power1.out"

        },

        2 + i * 0.025

    );

});


// ==================================
// SCENE 06
// EXIT TRANSITION
// ==================================

master.to(titleLetters, {

    y: -120,

    opacity: 0,

    stagger: 0.05,

    duration: 1

}, 7);


master.to(subtitle, {

    opacity: 0,

    y: 50,

    duration: 0.8

}, 7.2);


master.to(

    [circle, square, diamond],

    {

        scale: 2.5,

        opacity: 0,

        rotation: 360,

        duration: 1.5

    },

    7

);


// ==================================
// TIMELINE PROGRESS
// ==================================

master.eventCallback("onUpdate", () => {

    const percentage =
    (master.progress() * 100).toFixed(1);

    progress.style.width = percentage + "%";

});


// ==================================
// CONTROLS
// ==================================

document.getElementById("play").onclick = () => {

    master.play();

};


document.getElementById("pause").onclick = () => {

    master.pause();

};


document.getElementById("restart").onclick = () => {

    master.restart();

};


// ==================================
// AUTOMATIC INITIAL PLAY
// ==================================

master.play();

</script>

</body>
</html>
