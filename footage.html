<style>



/\* ===================================

&#x20;  GLOBAL

=================================== \*/



\* {

&#x20;   margin: 0;

&#x20;   padding: 0;

&#x20;   box-sizing: border-box;

}



:root {



&#x20;   --background: #080b14;



&#x20;   --surface: #101522;



&#x20;   --surface-light: #171e30;



&#x20;   --border: rgba(255,255,255,0.09);



&#x20;   --white: #f5f7ff;



&#x20;   --muted: #929bb0;



&#x20;   --blue: #6b8cff;



&#x20;   --cyan: #54dfff;



&#x20;   --purple: #a17cff;



}



html {

&#x20;   scroll-behavior: auto;

}



body {



&#x20;   background: var(--background);



&#x20;   color: var(--white);



&#x20;   font-family: 'DM Sans', sans-serif;



&#x20;   overflow-x: hidden;



}



a {

&#x20;   text-decoration: none;

&#x20;   color: inherit;

}



button {

&#x20;   font-family: inherit;

&#x20;   cursor: pointer;

}



.container {



&#x20;   width: min(1200px, 90%);



&#x20;   margin: auto;



}



.section-padding {



&#x20;   padding: 120px 0;



}





/\* ===================================

&#x20;  BACKGROUND

=================================== \*/



.background-glow {



&#x20;   position: fixed;



&#x20;   width: 600px;

&#x20;   height: 600px;



&#x20;   border-radius: 50%;



&#x20;   background: #365bff;



&#x20;   filter: blur(180px);



&#x20;   opacity: 0.12;



&#x20;   pointer-events: none;



&#x20;   z-index: -1;



&#x20;   top: -200px;

&#x20;   left: 30%;



}



.grid-background {



&#x20;   position: fixed;



&#x20;   inset: 0;



&#x20;   pointer-events: none;



&#x20;   z-index: -1;



&#x20;   background-image:



&#x20;       linear-gradient(

&#x20;           rgba(255,255,255,0.025) 1px,

&#x20;           transparent 1px

&#x20;       ),



&#x20;       linear-gradient(

&#x20;           90deg,

&#x20;           rgba(255,255,255,0.025) 1px,

&#x20;           transparent 1px

&#x20;       );



&#x20;   background-size: 70px 70px;



&#x20;   mask-image:

&#x20;       linear-gradient(

&#x20;           to bottom,

&#x20;           black,

&#x20;           transparent 85%

&#x20;       );



}





/\* ===================================

&#x20;  NAVIGATION

=================================== \*/



.navbar {



&#x20;   height: 85px;



&#x20;   display: flex;



&#x20;   align-items: center;



&#x20;   justify-content: space-between;



&#x20;   border-bottom: 1px solid var(--border);



&#x20;   position: relative;



&#x20;   z-index: 100;



}



.logo {



&#x20;   font-family: 'Space Grotesk', sans-serif;



&#x20;   font-size: 25px;



&#x20;   font-weight: 700;



&#x20;   letter-spacing: -1px;



}



.logo span {



&#x20;   color: var(--blue);



}



.nav-links {



&#x20;   display: flex;



&#x20;   gap: 35px;



}



.nav-links a {



&#x20;   color: var(--muted);



&#x20;   font-size: 13px;



&#x20;   transition: color .3s;



}



.nav-links a:hover {



&#x20;   color: white;



}



.nav-actions {



&#x20;   display: flex;



&#x20;   align-items: center;



&#x20;   gap: 20px;



}



.login {



&#x20;   color: var(--muted);



&#x20;   font-size: 13px;



}



.nav-button {



&#x20;   background: white;



&#x20;   color: #080b14;



&#x20;   padding: 12px 20px;



&#x20;   border-radius: 7px;



&#x20;   font-size: 13px;



&#x20;   font-weight: 700;



&#x20;   transition: .3s;



}



.nav-button:hover {



&#x20;   background: var(--cyan);



&#x20;   transform: translateY(-3px);



}





/\* ===================================

&#x20;  HERO

=================================== \*/



.hero {



&#x20;   min-height: 850px;



&#x20;   display: flex;



&#x20;   flex-direction: column;



&#x20;   align-items: center;



&#x20;   justify-content: center;



&#x20;   text-align: center;



&#x20;   padding: 90px 0 0;



&#x20;   position: relative;



}



.announcement {



&#x20;   border: 1px solid rgba(107,140,255,.35);



&#x20;   background: rgba(107,140,255,.08);



&#x20;   padding: 9px 17px;



&#x20;   border-radius: 30px;



&#x20;   color: #b9c8ff;



&#x20;   font-size: 11px;



&#x20;   letter-spacing: 1px;



&#x20;   margin-bottom: 30px;



}



.announcement span {



&#x20;   color: var(--cyan);



&#x20;   margin-right: 8px;



}



.hero h1 {



&#x20;   font-family: 'Space Grotesk', sans-serif;



&#x20;   font-size: clamp(55px, 8vw, 100px);



&#x20;   line-height: 1.04;



&#x20;   letter-spacing: -6px;



&#x20;   max-width: 950px;



}



.gradient-text {



&#x20;   background: linear-gradient(

&#x20;       100deg,

&#x20;       #70a2ff,

&#x20;       #b49aff,

&#x20;       #54dfff

&#x20;   );



&#x20;   background-clip: text;



&#x20;   -webkit-background-clip: text;



&#x20;   color: transparent;



}



.hero-description {



&#x20;   max-width: 590px;



&#x20;   margin-top: 28px;



&#x20;   color: var(--muted);



&#x20;   font-size: 16px;



&#x20;   line-height: 1.8;



}



.hero-buttons {



&#x20;   display: flex;



&#x20;   gap: 15px;



&#x20;   margin-top: 35px;



}



.primary-button {



&#x20;   background: #ffffff;



&#x20;   color: #090d19;



&#x20;   padding: 16px 26px;



&#x20;   border-radius: 7px;



&#x20;   font-weight: 700;



&#x20;   font-size: 13px;



&#x20;   transition: .3s;



}



.primary-button:hover {



&#x20;   background: var(--cyan);



&#x20;   transform: translateY(-4px);



&#x20;   box-shadow: 0 10px 35px rgba(84,223,255,.2);



}



.secondary-button {



&#x20;   border: 1px solid var(--border);



&#x20;   padding: 16px 26px;



&#x20;   border-radius: 7px;



&#x20;   font-size: 13px;



&#x20;   color: white;



&#x20;   transition: .3s;



}



.secondary-button:hover {



&#x20;   border-color: var(--blue);



&#x20;   background: rgba(107,140,255,.1);



}





/\* ===================================

&#x20;  HERO DASHBOARD

=================================== \*/



.dashboard-wrapper {



&#x20;   width: min(1000px, 95%);



&#x20;   margin: 100px auto 0;



&#x20;   position: relative;



&#x20;   perspective: 1200px;



}



.dashboard {



&#x20;   background: #101625;



&#x20;   border: 1px solid rgba(255,255,255,.13);



&#x20;   border-radius: 16px;



&#x20;   padding: 20px;



&#x20;   box-shadow:



&#x20;       0 40px 100px rgba(0,0,0,.5),



&#x20;       0 0 80px rgba(77,110,255,.12);



&#x20;   transform: rotateX(5deg);



&#x20;   position: relative;



&#x20;   overflow: hidden;



}



.dashboard-top {



&#x20;   display: flex;



&#x20;   justify-content: space-between;



&#x20;   align-items: center;



&#x20;   padding-bottom: 20px;



&#x20;   border-bottom: 1px solid var(--border);



}



.dashboard-title {



&#x20;   font-size: 14px;



&#x20;   font-weight: 700;



}



.dashboard-status {



&#x20;   color: #70e8bd;



&#x20;   font-size: 11px;



}



.dashboard-body {



&#x20;   display: grid;



&#x20;   grid-template-columns: 1fr 1fr 1fr;



&#x20;   gap: 15px;



&#x20;   margin-top: 20px;



}



.stat-card {



&#x20;   background: #171f30;



&#x20;   padding: 20px;



&#x20;   border: 1px solid var(--border);



&#x20;   border-radius: 9px;



}



.stat-label {



&#x20;   font-size: 11px;



&#x20;   color: var(--muted);



}



.stat-number {



&#x20;   font-family: 'Space Grotesk';



&#x20;   font-size: 30px;



&#x20;   margin-top: 12px;



}



.stat-change {



&#x20;   color: #6be3b2;



&#x20;   font-size: 11px;



&#x20;   margin-top: 5px;



}



.chart-card {



&#x20;   grid-column: span 3;



&#x20;   height: 190px;



&#x20;   background: #171f30;



&#x20;   border-radius: 9px;



&#x20;   border: 1px solid var(--border);



&#x20;   padding: 20px;



}



.chart-title {



&#x20;   font-size: 12px;



&#x20;   color: var(--muted);



&#x20;   margin-bottom: 20px;



}



.chart {



&#x20;   height: 115px;



&#x20;   display: flex;



&#x20;   align-items: end;



&#x20;   gap: 12px;



}



.bar {



&#x20;   flex: 1;



&#x20;   border-radius: 4px 4px 0 0;



&#x20;   background: linear-gradient(

&#x20;       to top,

&#x20;       #506aff,

&#x20;       #54dfff

&#x20;   );



&#x20;   height: 0%;



&#x20;   opacity: .85;



}





/\* FLOATING CARDS \*/



.floating-card {



&#x20;   position: absolute;



&#x20;   padding: 17px 22px;



&#x20;   background: rgba(25,35,57,.95);



&#x20;   border: 1px solid rgba(255,255,255,.13);



&#x20;   backdrop-filter: blur(20px);



&#x20;   border-radius: 10px;



&#x20;   box-shadow: 0 15px 50px rgba(0,0,0,.3);



&#x20;   font-size: 12px;



}



.floating-one {



&#x20;   top: 18%;



&#x20;   left: -90px;



}



.floating-two {



&#x20;   bottom: 18%;



&#x20;   right: -80px;



}



.float-number {



&#x20;   font-size: 22px;



&#x20;   font-weight: 700;



&#x20;   margin-top: 8px;



&#x20;   color: var(--cyan);



}





/\* ===================================

&#x20;  TRUST SECTION

=================================== \*/



.trust-section {



&#x20;   padding: 110px 0;



&#x20;   text-align: center;



}



.trust-section p {



&#x20;   color: var(--muted);



&#x20;   font-size: 12px;



&#x20;   letter-spacing: 2px;



&#x20;   margin-bottom: 40px;



}



.brand-list {



&#x20;   display: flex;



&#x20;   justify-content: center;



&#x20;   flex-wrap: wrap;



&#x20;   gap: 70px;



&#x20;   color: #647087;



&#x20;   font-family: 'Space Grotesk';



&#x20;   font-size: 23px;



&#x20;   font-weight: 700;



}





/\* ===================================

&#x20;  SECTION HEADINGS

=================================== \*/



.section-heading {



&#x20;   text-align: center;



&#x20;   margin-bottom: 65px;



}



.section-heading span {



&#x20;   color: var(--cyan);



&#x20;   font-size: 11px;



&#x20;   letter-spacing: 3px;



}



.section-heading h2 {



&#x20;   font-family: 'Space Grotesk';



&#x20;   font-size: clamp(35px, 5vw, 58px);



&#x20;   margin-top: 20px;



&#x20;   letter-spacing: -2px;



}



.section-heading p {



&#x20;   color: var(--muted);



&#x20;   max-width: 550px;



&#x20;   margin: 20px auto 0;



&#x20;   line-height: 1.8;



&#x20;   font-size: 14px;



}





/\* ===================================

&#x20;  FEATURES

=================================== \*/



.features-grid {



&#x20;   display: grid;



&#x20;   grid-template-columns: repeat(3, 1fr);



&#x20;   gap: 18px;



}



.feature-card {



&#x20;   background: linear-gradient(

&#x20;       145deg,

&#x20;       #151d30,

&#x20;       #0e1422

&#x20;   );



&#x20;   border: 1px solid var(--border);



&#x20;   border-radius: 13px;



&#x20;   padding: 32px;



&#x20;   min-height: 250px;



&#x20;   transition: .4s;



}



.feature-card:hover {



&#x20;   transform: translateY(-9px);



&#x20;   border-color: rgba(84,223,255,.5);



&#x20;   background: #18243b;



}



.feature-icon {



&#x20;   width: 45px;



&#x20;   height: 45px;



&#x20;   border-radius: 12px;



&#x20;   background: rgba(107,140,255,.15);



&#x20;   display: flex;



&#x20;   align-items: center;



&#x20;   justify-content: center;



&#x20;   color: var(--cyan);



&#x20;   font-size: 22px;



&#x20;   margin-bottom: 30px;



}



.feature-card h3 {



&#x20;   font-size: 19px;



&#x20;   margin-bottom: 14px;



}



.feature-card p {



&#x20;   font-size: 13px;



&#x20;   color: var(--muted);



&#x20;   line-height: 1.8;



}





/\* ===================================

&#x20;  PRODUCT SHOWCASE

=================================== \*/



.product-section {



&#x20;   display: grid;



&#x20;   grid-template-columns: 1fr 1fr;



&#x20;   align-items: center;



&#x20;   gap: 90px;



}



.product-content span {



&#x20;   color: var(--cyan);



&#x20;   font-size: 11px;



&#x20;   letter-spacing: 3px;



}



.product-content h2 {



&#x20;   font-family: 'Space Grotesk';



&#x20;   font-size: clamp(38px, 5vw, 60px);



&#x20;   line-height: 1.1;



&#x20;   margin: 25px 0;



}



.product-content p {



&#x20;   color: var(--muted);



&#x20;   font-size: 14px;



&#x20;   line-height: 1.9;



}



.product-points {



&#x20;   margin-top: 30px;



}



.product-points div {



&#x20;   padding: 13px 0;



&#x20;   border-bottom: 1px solid var(--border);



&#x20;   color: #d5dced;



&#x20;   font-size: 13px;



}



.product-points div::before {



&#x20;   content: "✓";



&#x20;   color: var(--cyan);



&#x20;   margin-right: 12px;



}





/\* PRODUCT VISUAL \*/



.product-visual {



&#x20;   min-height: 420px;



&#x20;   background:



&#x20;       radial-gradient(

&#x20;           circle at center,

&#x20;           #263d78,

&#x20;           #11192b 70%

&#x20;       );



&#x20;   border: 1px solid var(--border);



&#x20;   border-radius: 20px;



&#x20;   position: relative;



&#x20;   display: flex;



&#x20;   align-items: center;



&#x20;   justify-content: center;



&#x20;   overflow: hidden;



}



.visual-circle {



&#x20;   width: 220px;



&#x20;   height: 220px;



&#x20;   border-radius: 50%;



&#x20;   border: 1px solid rgba(84,223,255,.5);



&#x20;   display: flex;



&#x20;   align-items: center;



&#x20;   justify-content: center;



&#x20;   box-shadow: 0 0 100px rgba(84,223,255,.2);



}



.visual-circle-inner {



&#x20;   width: 150px;



&#x20;   height: 150px;



&#x20;   border-radius: 50%;



&#x20;   background: linear-gradient(

&#x20;       135deg,

&#x20;       #6b8cff,

&#x20;       #54dfff

&#x20;   );



&#x20;   box-shadow: 0 0 80px rgba(84,223,255,.5);



}



.orbit {



&#x20;   position: absolute;



&#x20;   width: 330px;



&#x20;   height: 330px;



&#x20;   border: 1px dashed rgba(255,255,255,.2);



&#x20;   border-radius: 50%;



}



.orbit-dot {



&#x20;   position: absolute;



&#x20;   top: 0;



&#x20;   left: 50%;



&#x20;   width: 15px;



&#x20;   height: 15px;



&#x20;   background: var(--cyan);



&#x20;   border-radius: 50%;



&#x20;   box-shadow: 0 0 20px var(--cyan);



}





/\* ===================================

&#x20;  CTA

=================================== \*/



.cta {



&#x20;   text-align: center;



&#x20;   background: linear-gradient(

&#x20;       120deg,

&#x20;       #17284b,

&#x20;       #171a38

&#x20;   );



&#x20;   border: 1px solid rgba(107,140,255,.3);



&#x20;   border-radius: 20px;



&#x20;   padding: 90px 25px;



&#x20;   position: relative;



&#x20;   overflow: hidden;



}



.cta h2 {



&#x20;   font-family: 'Space Grotesk';



&#x20;   font-size: clamp(35px, 5vw, 60px);



&#x20;   letter-spacing: -2px;



}



.cta p {



&#x20;   color: #aebbd4;



&#x20;   margin: 20px auto 30px;



&#x20;   max-width: 500px;



&#x20;   line-height: 1.8;



&#x20;   font-size: 14px;



}





/\* ===================================

&#x20;  FOOTER

=================================== \*/



footer {



&#x20;   padding: 45px 0;



&#x20;   border-top: 1px solid var(--border);



&#x20;   margin-top: 120px;



&#x20;   color: var(--muted);



&#x20;   font-size: 12px;



}



.footer-inner {



&#x20;   display: flex;



&#x20;   justify-content: space-between;



}





/\* ===================================

&#x20;  SCROLL ANIMATION INITIAL STATES

=================================== \*/



.reveal {



&#x20;   opacity: 0;



&#x20;   transform: translateY(50px);



}



.reveal-left {



&#x20;   opacity: 0;



&#x20;   transform: translateX(-60px);



}



.reveal-right {



&#x20;   opacity: 0;



&#x20;   transform: translateX(60px);



}





/\* ===================================

&#x20;  RESPONSIVE

=================================== \*/



@media(max-width: 850px) {



&#x20;   .nav-links {

&#x20;       display: none;

&#x20;   }



&#x20;   .dashboard-body {

&#x20;       grid-template-columns: 1fr 1fr;

&#x20;   }



&#x20;   .stat-card:last-of-type {

&#x20;       display: none;

&#x20;   }



&#x20;   .chart-card {

&#x20;       grid-column: span 2;

&#x20;   }



&#x20;   .floating-card {

&#x20;       display: none;

&#x20;   }



&#x20;   .features-grid {

&#x20;       grid-template-columns: 1fr 1fr;

&#x20;   }



&#x20;   .product-section {

&#x20;       grid-template-columns: 1fr;

&#x20;       gap: 45px;

&#x20;   }



&#x20;   .brand-list {

&#x20;       gap: 30px;

&#x20;   }



}



@media(max-width: 550px) {



&#x20;   .hero {

&#x20;       min-height: 720px;

&#x20;   }



&#x20;   .hero h1 {

&#x20;       letter-spacing: -3px;

&#x20;   }



&#x20;   .dashboard-wrapper {

&#x20;       margin-top: 65px;

&#x20;   }



&#x20;   .dashboard {

&#x20;       padding: 12px;

&#x20;   }



&#x20;   .stat-number {

&#x20;       font-size: 21px;

&#x20;   }



&#x20;   .features-grid {

&#x20;       grid-template-columns: 1fr;

&#x20;   }



&#x20;   .hero-buttons {

&#x20;       flex-direction: column;

&#x20;   }



&#x20;   .brand-list {

&#x20;       font-size: 17px;

&#x20;   }



&#x20;   .footer-inner {

&#x20;       flex-direction: column;

&#x20;       gap: 15px;

&#x20;   }



}




</head>
